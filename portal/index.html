<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-padding.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zohelo Data Portal</title>
    <meta
      name="description"
      content="Explore the Zohelo Data catalogue and query published data releases."
    />
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Open Graph (Facebook, Slack, Discord, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Zohelo Data" />
    <meta property="og:title" content="Zohelo Data Portal" />
    <meta
      property="og:description"
      content="Explore the Zohelo Data catalogue and query published releases with DuckDB in your browser."
    />
    <meta property="og:url" content="https://data.zohelo.com/" />
    <meta property="og:image" content="https://data.zohelo.com/logo-padding.png" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Zohelo Data Portal" />
    <meta
      name="twitter:description"
      content="Explore the Zohelo Data catalogue and query published releases with DuckDB in your browser."
    />
    <meta name="twitter:image" content="https://data.zohelo.com/logo-padding.png" />

    <!-- Structured data for search engines -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Zohelo Data Portal",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Web",
        "description": "A browser-based catalogue and DuckDB workspace for published Zohelo Data releases.",
        "url": "https://data.zohelo.com/"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Reserved runtime configuration surface. An external file keeps the CSP
         free of an inline script. -->
    <script src="/env.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
