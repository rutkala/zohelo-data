name: Migrate Google Drive layout
on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'plan is read-only; apply/resume/rollback mutate Drive'
        type: choice
        default: plan
        options: [plan, apply, resume, rollback, verify]
      expected_root_id:
        type: string
        default: '1b9ucISOOUXQd6Ku-6qp6g373w9HJ2WOf'
        required: true
      compatibility_commit:
        type: string
        required: false
      plan_run_id:
        type: string
        required: false
      plan_sha256:
        type: string
        required: false
      confirm:
        type: boolean
        default: false
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: zohelo-production-data
  cancel-in-progress: false
  queue: max
jobs:
  migrate_drive:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Validate dispatch inputs
        env:
          OPERATION: ${{ inputs.operation }}
          COMPATIBILITY_COMMIT: ${{ inputs.compatibility_commit }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
          PLAN_SHA256: ${{ inputs.plan_sha256 }}
          CONFIRMED: ${{ inputs.confirm }}
        run: |
          if [[ "$OPERATION" =~ ^(apply|resume|rollback)$ && "$CONFIRMED" != "true" ]]; then exit 1; fi
          if [[ "$OPERATION" =~ ^(apply|resume|rollback)$ && -z "$COMPATIBILITY_COMMIT" ]]; then exit 1; fi
          if [[ "$OPERATION" == "apply" && ( -z "$PLAN_RUN_ID" || -z "$PLAN_SHA256" ) ]]; then exit 1; fi
      - name: Download reviewed plan artifact
        if: inputs.operation == 'apply'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: migration-plan
          path: reviewed-plan
          run-id: ${{ inputs.plan_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify cutover preconditions
        if: inputs.operation == 'apply' || inputs.operation == 'resume' || inputs.operation == 'rollback'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPATIBILITY_COMMIT: ${{ inputs.compatibility_commit }}
        run: python scripts/check_cutover_preconditions.py --compatibility-commit "$COMPATIBILITY_COMMIT"
      - name: Execute migration operation
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          ZOHELO_ALLOW_PRODUCTION_WRITES: 'true'
          OPERATION: ${{ inputs.operation }}
          EXPECTED_ROOT_ID: ${{ inputs.expected_root_id }}
          PLAN_SHA256: ${{ inputs.plan_sha256 }}
          CONFIRMED: ${{ inputs.confirm }}
        run: |
          args=(--operation "$OPERATION" --expected-root-id "$EXPECTED_ROOT_ID")
          if [[ "$CONFIRMED" == "true" ]]; then args+=(--confirm); fi
          if [[ "$OPERATION" == "apply" ]]; then args+=(--plan-file reviewed-plan/plan.json --plan-sha256 "$PLAN_SHA256"); fi
          python scripts/migrate_drive_layout.py "${args[@]}"
      - name: Record plan identity
        if: always() && inputs.operation == 'plan'
        run: |
          python -c 'import json; p=json.load(open("plan.json")); open("plan-identity.json","w").write(json.dumps({"workflow_commit":"${{ github.sha }}","plan_id":p.get("plan_id"),"plan_sha256":p.get("plan_sha256"),"root_id":p.get("root_id")},indent=2)+"\n")'
      - name: Upload reviewed plan
        if: always() && inputs.operation == 'plan'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: migration-plan
          path: |
            plan.json
            plan-identity.json
          if-no-files-found: error
      - name: Upload migration receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: migration-receipts
          path: |
            plan.json
            journal.json
            verification.json
            operation-result.json
            migration-error.json
            cutover-preconditions.json
          if-no-files-found: ignore
