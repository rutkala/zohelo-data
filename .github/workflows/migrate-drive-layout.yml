name: Migrate Google Drive layout
on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Migration operation: plan (dry run), apply (execute migration), resume (resume interrupted), rollback (reverse migration), verify (inspect current)'
        type: choice
        default: plan
        options: [plan, apply, resume, rollback, verify]
      expected_root_id:
        description: 'Expected Drive root ID safety pin'
        type: string
        default: '1b9ucISOOUXQd6Ku-6qp6g373w9HJ2WOf'
        required: true

permissions:
  contents: read

concurrency:
  group: zohelo-production-data
  cancel-in-progress: false

jobs:
  migrate_drive:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Execute Drive layout migration operation
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          ZOHELO_ALLOW_PRODUCTION_WRITES: 'true'
        run: |
          args=(--operation "${{ inputs.operation }}" --expected-root-id "${{ inputs.expected_root_id }}")
          if [[ "${{ inputs.operation }}" == "apply" ]]; then
            args+=(--apply)
          fi
          python scripts/migrate_drive_layout.py "${args[@]}"
