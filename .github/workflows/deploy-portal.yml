name: Deploy Unified Data Portal

on:
  push:
    branches: [ main ]
    paths:
      - 'portal/**'
      - 'models/**'
      - 'dbt_project.yml'
      - 'profiles.yml'
      - 'requirements.txt'
      - '.github/workflows/deploy-portal.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate dbt docs
        run: dbt docs generate --profiles-dir .

      - name: Copy docs into portal
        run: |
          mkdir -p portal/docs
          cp target/index.html portal/docs/index.html
          cp target/manifest.json portal/docs/manifest.json
          cp target/catalog.json portal/docs/catalog.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: portal

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
