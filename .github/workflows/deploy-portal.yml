name: Deploy Unified Data Portal

on:
  push:
    branches: [ main ]
    paths:
      - 'portal/**'
      - 'models/**'
      - 'dbt_project.yml'
      - 'profiles.yml'
      - 'requirements.txt'
      - '.github/workflows/deploy-portal.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate dbt docs
        run: dbt docs generate --profiles-dir .

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'portal/package-lock.json'

      - name: Install portal dependencies
        working-directory: portal
        run: npm ci

      - name: Build Duck-UI portal
        working-directory: portal
        env:
          DUCK_UI_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
        run: npm run build

      - name: Copy dbt docs into portal build output
        run: |
          mkdir -p portal/dist/docs
          cp target/index.html portal/dist/docs/index.html
          cp target/*.json portal/dist/docs/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: portal/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
