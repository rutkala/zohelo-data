name: Deploy portal

on:
  push:
    branches: [main]
    paths:
      - 'portal/**'
      - 'worker/**'
      - 'scripts/publish-r2-portal-index.py'
      - '!portal/scripts/**'
      - 'scripts/prepare_dbt_viewer.py'
      - 'scripts/verify_portal_build_marker.py'
      - 'requirements.txt'
      - '.python-version'
      - '.node-version'
      - '.github/workflows/deploy-portal.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dbt Docs dependencies
        run: python -m pip install -c requirements.txt dbt-core
      - name: Prepare the dbt Docs viewer
        run: |
          rm -rf portal/public/docs
          python scripts/prepare_dbt_viewer.py
      - name: Publish the private R2 portal index
        env:
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          R2_S3_ENDPOINT: ${{ vars.R2_S3_ENDPOINT }}
          R2_LAKEHOUSE_BUCKET: ${{ vars.R2_LAKEHOUSE_BUCKET }}
        run: |
          python -m pip install boto3
          python scripts/publish-r2-portal-index.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - name: Deploy the private R2 read API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PORTAL_ALLOWED_GOOGLE_EMAIL: ${{ secrets.PORTAL_ALLOWED_GOOGLE_EMAIL }}
        run: |
          set -euo pipefail
          output="$(npx --yes wrangler@latest deploy --config worker/wrangler.toml 2>&1)"
          printf '%s\n' "$output"
          api_url="$(printf '%s\n' "$output" | grep -Eo 'https://[^[:space:]]+\.workers\.dev' | tail -1)"
          test -n "$api_url"
          echo "DUCK_UI_R2_API_BASE=${api_url%/}" >> "$GITHUB_ENV"
          printf '%s' "$PORTAL_ALLOWED_GOOGLE_EMAIL" | npx --yes wrangler@latest secret put ALLOWED_GOOGLE_EMAIL --config worker/wrangler.toml
          openssl rand -hex 32 | npx --yes wrangler@latest secret put DOWNLOAD_SIGNING_KEY --config worker/wrangler.toml
      - name: Install portal dependencies
        working-directory: portal
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the portal
        working-directory: portal
        env:
          DUCK_UI_BASEPATH: ${{ steps.pages.outputs.base_path }}/
          DUCK_UI_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          DUCK_UI_R2_API_BASE: ${{ env.DUCK_UI_R2_API_BASE }}
        run: npm run build
      - name: Write the build identity and check required output
        run: |
          python - <<'PYCODE'
          import json, os
          from pathlib import Path
          Path('portal/dist/portal-build.json').write_text(json.dumps({
              'git_commit': os.environ['GITHUB_SHA'],
              'supported_release_formats': [1, 2],
              'supported_drive_layouts': [],
              'data_source': 'cloudflare-r2',
              'supported_retained_bronze_formats': [1, 2],
          }) + '\n')
          PYCODE
          test -s portal/dist/docs/viewer-template.html
          test ! -e portal/dist/docs/index.html
          test ! -e portal/dist/docs/manifest.json
          test ! -e portal/dist/docs/catalog.json
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: portal/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Confirm the deployed build identity
        env:
          PORTAL_ORIGIN: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_GIT_COMMIT: ${{ github.sha }}
        run: |
          python scripts/verify_portal_build_marker.py \
            --origin "$PORTAL_ORIGIN" \
            --expected-git-commit "$EXPECTED_GIT_COMMIT"
