name: Deploy portal

on:
  push:
    branches: [ main ]
    paths:
      - 'portal/**'
      - 'scripts/prepare_dbt_viewer.py'
      - 'requirements.txt'
      - '.python-version'
      - '.node-version'
      - '.github/workflows/deploy-portal.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Read the existing Pages site configuration
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Set up shared Python version
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: '.python-version'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Stage the generic dbt Docs viewer template
        run: |
          rm -rf portal/public/docs
          python scripts/prepare_dbt_viewer.py

      - name: Set up shared Node.js version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'
          cache-dependency-path: 'portal/package-lock.json'

      - name: Install portal dependencies
        working-directory: portal
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint portal source
        working-directory: portal
        run: npm run lint

      - name: Run portal unit and engine regression tests
        working-directory: portal
        run: npm test

      - name: Build Duck-UI portal
        working-directory: portal
        env:
          DUCK_UI_BASEPATH: ${{ steps.pages.outputs.base_path }}/
          DUCK_UI_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
        run: npm run build

      - name: Identify the deployed portal code
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          Path('portal/dist/portal-build.json').write_text(
              json.dumps({'git_commit': os.environ['GITHUB_SHA'], 'supported_release_formats': [1, 2]}) + '\n'
          )
          PY

      - name: Verify the generic dbt Docs viewer is deployed
        run: |
          test -s portal/dist/docs/viewer-template.html
          test ! -e portal/dist/docs/index.html
          test ! -e portal/dist/docs/manifest.json
          test ! -e portal/dist/docs/catalog.json

      - name: Remove staged dbt Docs viewer template
        if: always()
        run: rm -rf portal/public/docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: portal/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
