name: Deploy Unified Data Portal

on:
  push:
    branches: [ main ]
    paths:
      - 'portal/**'
      - 'models/**'
      - 'macros/**'
      - 'dbt_project.yml'
      - '.dbtignore'
      - 'profiles.yml'
      - 'requirements.txt'
      - '.python-version'
      - '.node-version'
      - '.github/workflows/deploy-portal.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: portal-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read the existing Pages site configuration
        id: pages
        uses: actions/configure-pages@v5

      - name: Set up shared Python version
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Generate dbt docs
        run: dbt docs generate --profiles-dir .

      - name: Set up shared Node.js version
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'
          cache-dependency-path: 'portal/package-lock.json'

      - name: Install portal dependencies
        working-directory: portal
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build Duck-UI portal
        working-directory: portal
        env:
          DUCK_UI_BASEPATH: ${{ steps.pages.outputs.base_path }}/
          DUCK_UI_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
        run: npm run build

      - name: Identify the deployed portal code
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          Path('portal/dist/portal-build.json').write_text(
              json.dumps({'git_commit': os.environ['GITHUB_SHA']}) + '\n'
          )
          PY

      - name: Copy dbt docs into portal build output
        run: |
          mkdir -p portal/dist/docs
          cp target/index.html portal/dist/docs/index.html
          cp target/*.json portal/dist/docs/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: portal/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
