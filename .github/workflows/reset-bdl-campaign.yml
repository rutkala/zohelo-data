name: Reset GUS BDL data
on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'plan is read-only; apply/resume mutate Drive (recoverable trash only)'
        type: choice
        default: plan
        options: [plan, apply, resume, verify]
      expected_root_id:
        type: string
        default: '1b9ucISOOUXQd6Ku-6qp6g373w9HJ2WOf'
        required: true
      plan_run_id:
        type: string
        required: false
      plan_id:
        type: string
        required: false
      plan_sha256:
        type: string
        required: false
      confirm:
        type: boolean
        default: false
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: zohelo-production-data
  cancel-in-progress: false
  queue: max
jobs:
  reset_bdl:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Validate dispatch inputs
        env:
          OPERATION: ${{ inputs.operation }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
          PLAN_ID: ${{ inputs.plan_id }}
          PLAN_SHA256: ${{ inputs.plan_sha256 }}
          CONFIRMED: ${{ inputs.confirm }}
        run: |
          python scripts/validate_bdl_reset_dispatch.py \
            --operation "$OPERATION" \
            --confirmed "$CONFIRMED" \
            --plan-run-id "$PLAN_RUN_ID" \
            --plan-id "$PLAN_ID" \
            --plan-sha256 "$PLAN_SHA256"
      - name: Download reviewed plan artifact
        if: inputs.operation == 'apply' || inputs.operation == 'resume' || inputs.operation == 'verify'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bdl-reset-plan
          path: reviewed-plan
          run-id: ${{ inputs.plan_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify reviewed plan provenance
        if: inputs.operation == 'apply' || inputs.operation == 'resume' || inputs.operation == 'verify'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
          EXPECTED_ROOT_ID: ${{ inputs.expected_root_id }}
          PLAN_ID: ${{ inputs.plan_id }}
          PLAN_SHA256: ${{ inputs.plan_sha256 }}
          REPOSITORY: ${{ github.repository }}
          EXECUTING_COMMIT: ${{ github.sha }}
        run: |
          python scripts/verify_bdl_reset_plan.py \
            --plan reviewed-plan/plan.json \
            --identity reviewed-plan/plan-identity.json \
            --run-id "$PLAN_RUN_ID" \
            --expected-root-id "$EXPECTED_ROOT_ID" \
            --expected-plan-id "$PLAN_ID" \
            --expected-plan-sha256 "$PLAN_SHA256" \
            --repository "$REPOSITORY" \
            --executing-commit "$EXECUTING_COMMIT"
      - name: Verify BDL producer exclusion preconditions
        if: inputs.operation == 'apply' || inputs.operation == 'resume'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_bdl_reset_preconditions.py
      - name: Execute BDL reset operation
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          ZOHELO_ALLOW_PRODUCTION_WRITES: 'true'
          OPERATION: ${{ inputs.operation }}
          EXPECTED_ROOT_ID: ${{ inputs.expected_root_id }}
          PLAN_SHA256: ${{ inputs.plan_sha256 }}
          CONFIRMED: ${{ inputs.confirm }}
        run: |
          args=(--operation "$OPERATION" --expected-root-id "$EXPECTED_ROOT_ID")
          if [[ "$CONFIRMED" == "true" ]]; then args+=(--confirm); fi
          if [[ "$OPERATION" =~ ^(apply|resume|verify)$ ]]; then
            args+=(--plan-file reviewed-plan/plan.json --plan-sha256 "$PLAN_SHA256")
          fi
          python scripts/reset-bdl-campaign.py "${args[@]}"
      - name: Record plan identity
        if: success() && inputs.operation == 'plan'
        run: |
          python scripts/record_bdl_reset_plan_identity.py \
            --plan plan.json \
            --repository "${{ github.repository }}" \
            --run-id "${{ github.run_id }}" \
            --workflow-commit "${{ github.sha }}"
      - name: Upload reviewed plan
        if: success() && inputs.operation == 'plan'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bdl-reset-plan
          path: |
            plan.json
            plan-identity.json
          if-no-files-found: error
      - name: Upload reset receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bdl-reset-receipts
          path: |
            plan.json
            journal.json
            bdl-reset-journal.json
            recovery-receipt.json
            verification.json
            operation-result.json
            bdl-reset-error.json
            bdl-reset-preconditions.json
            plan-provenance.json
            dispatch-preconditions.json
          if-no-files-found: ignore
