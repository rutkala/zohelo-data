name: OpenData.org data pipeline

on:
  workflow_dispatch:
    inputs:
      category:
        description: 'OpenData Senzing entity category to process into Bronze (default: all parallel)'
        type: choice
        default: all
        options: [all, organizations, locations, people]
      max_files:
        description: 'Maximum member JSON files to convert (0 for unlimited full dataset)'
        type: string
        default: '0'
  push:
    branches: [main]
    paths:
      - 'src/ingestion/sources/opendata_bronze_loader.py'
      - 'scripts/publish_opendata_bronze.py'
      - 'config/source-campaigns.yaml'
      - 'config/sources.yaml'
      - '.github/workflows/source-opendata.yml'

permissions:
  contents: read

jobs:
  stream_to_bronze:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_dispatch' || inputs.category == 'all' || inputs.category == matrix.category)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        category: [organizations, locations, people]
    concurrency:
      group: zohelo-pipeline-opendata-${{ matrix.category }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Stream unpack Landing ZIP directly to Bronze Parquet (zero disk extraction)
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          OPENDATA_CATEGORY: ${{ matrix.category }}
          OPENDATA_MAX_FILES: ${{ inputs.max_files || '0' }}
        run: |
          python src/ingestion/sources/opendata_bronze_loader.py \
            --category "$OPENDATA_CATEGORY" \
            --max-files "$OPENDATA_MAX_FILES" \
            --allow-production-write
      - name: Publish Bronze manifest and pointer for Portal availability
        if: always()
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          OPENDATA_CATEGORY: ${{ matrix.category }}
        run: |
          python scripts/publish_opendata_bronze.py \
            --category "$OPENDATA_CATEGORY" \
            --allow-production-write
      - name: Verify bronze checkpoint status in fresh process
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          OPENDATA_CATEGORY: ${{ matrix.category }}
        run: |
          python src/ingestion/sources/opendata_bronze_loader.py \
            --category "$OPENDATA_CATEGORY" \
            --verify-checkpoint
