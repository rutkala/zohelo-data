name: OpenData.org data pipeline

on:
  schedule:
    - cron: '45 3 * * 0'
  workflow_dispatch:
    inputs:
      category:
        description: 'OpenData Senzing entity category to process into Bronze'
        type: choice
        default: all
        options: [all, organizations, locations, people]
      max_files:
        description: 'Maximum member JSON files to stream and convert in this batch'
        type: choice
        default: '5'
        options: ['1', '3', '5', '10', '20']
  push:
    branches: [main]
    paths:
      - 'src/ingestion/sources/opendata_bronze_loader.py'
      - 'scripts/publish_opendata_bronze.py'
      - 'config/source-campaigns.yaml'
      - 'config/sources.yaml'
      - '.github/workflows/source-opendata.yml'

permissions:
  contents: read

concurrency:
  group: zohelo-pipeline-opendata
  cancel-in-progress: false

jobs:
  stream_to_bronze:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'push' || contains(github.event.head_commit.message, '[run-opendata]'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Stream unpack Landing ZIP directly to Bronze Parquet (zero disk extraction)
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          OPENDATA_CATEGORY: ${{ inputs.category || 'all' }}
          OPENDATA_MAX_FILES: ${{ inputs.max_files || '5' }}
        run: |
          python src/ingestion/sources/opendata_bronze_loader.py \
            --category "$OPENDATA_CATEGORY" \
            --max-files "$OPENDATA_MAX_FILES" \
            --allow-production-write
      - name: Publish Bronze manifest and pointer for Portal availability
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: python scripts/publish_opendata_bronze.py --allow-production-write
      - name: Verify bronze checkpoint status in fresh process
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: python src/ingestion/sources/opendata_bronze_loader.py --verify-checkpoint
