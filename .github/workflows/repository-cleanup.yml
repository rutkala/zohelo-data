name: One-time repository cleanup

on:
  push:
    branches: [remove-tests-minimal-actions-20260929]
    paths:
      - '.github/workflows/repository-cleanup.yml'
      - 'scripts/_remove_tests_once.py'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.ref == 'refs/heads/remove-tests-minimal-actions-20260929'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: remove-tests-minimal-actions-20260929
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Install only the YAML editor
        run: python -m pip install -c requirements.txt PyYAML
      - name: Delete tests and test-only tooling; preserve application code
        run: |
          python scripts/_remove_tests_once.py
          rm scripts/_remove_tests_once.py
      - name: Commit cleanup on this branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove repository tests, fixtures and test-only dependencies [skip ci]'
          git push origin HEAD:remove-tests-minimal-actions-20260929
      - name: Save source changes for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repository-cleanup
          path: ${{ runner.temp }}/repository-cleanup
          if-no-files-found: warn
          retention-days: 3
