name: Validate data platform

on:
  pull_request:
    paths:
      - 'src/**'
      - 'config/**'
      - 'models/**'
      - 'macros/**'
      - 'tests/**'
      - 'scripts/**'
      - 'requirements.*'
      - 'dbt_project.yml'
      - '.dbtignore'
      - 'profiles.yml'
      - '.python-version'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixtures:
    name: Python and dbt fixture checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select relevant checks
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          data=false
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            data=true
          else
            git diff --name-only -z "$BASE_SHA" HEAD > "$RUNNER_TEMP/changed-files"
            while IFS= read -r -d '' path; do
              case "$path" in
                scripts/migrate-drive-to-r2.py|scripts/check-workflows.py|.github/workflows/*) ;;
                src/*|config/*|models/*|macros/*|tests/*|scripts/*|requirements.*|dbt_project.yml|.dbtignore|profiles.yml|.python-version) data=true ;;
              esac
            done < "$RUNNER_TEMP/changed-files"
          fi
          echo "data=$data" >> "$GITHUB_OUTPUT"
          if [ "$data" = false ]; then
            echo 'Copy/workflow-only change: no Python/dbt regression suite or platform dependency installation.'
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install workflow parser only
        if: steps.scope.outputs.data == 'false'
        run: python -m pip install -c requirements.txt PyYAML
      - name: Install data-platform dependencies when data code changed
        if: steps.scope.outputs.data == 'true'
        run: python -m pip install -r requirements.txt
      - name: Check workflow safety policy
        run: python scripts/check-workflows.py
      - name: Check data logic when data code changed
        if: steps.scope.outputs.data == 'true'
        run: bash scripts/check-data.sh
