name: Code checks

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'requirements.*'
      - '.python-version'
  workflow_dispatch:
    inputs:
      test_file:
        description: 'Optional single Python test file, e.g. test_migration_plan_provenance.py; empty means syntax checks only'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: code-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
      - name: Install workflow parser
        run: python -m pip install -c requirements.txt PyYAML
      - name: Check Python syntax and workflow safety
        run: |
          python -m compileall -q src scripts
          python scripts/check-workflows.py
      - name: Check explicitly requested test filename
        if: github.event_name == 'workflow_dispatch' && inputs.test_file != ''
        env:
          TEST_FILE: ${{ inputs.test_file }}
        run: |
          python - <<'PYCODE'
          import os, re
          from pathlib import Path
          name = os.environ['TEST_FILE']
          if not re.fullmatch(r'test_[A-Za-z0-9_]+\.py', name) or not (Path('tests') / name).is_file():
              raise SystemExit('Specify one existing test_*.py file from tests/, not a pattern or path')
          PYCODE
      - name: Install dependencies only for the requested test
        if: github.event_name == 'workflow_dispatch' && inputs.test_file != ''
        run: python -m pip install -r requirements.txt
      - name: Run only the requested test file
        if: github.event_name == 'workflow_dispatch' && inputs.test_file != ''
        env:
          TEST_FILE: ${{ inputs.test_file }}
        run: python -m unittest discover -s tests -p "$TEST_FILE"
