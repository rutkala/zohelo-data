name: Validate data platform

on:
  pull_request:
    paths:
      - 'src/**'
      - 'config/**'
      - 'models/**'
      - 'macros/**'
      - 'tests/**'
      - 'scripts/**'
      - 'requirements.*'
      - 'dbt_project.yml'
      - '.dbtignore'
      - 'profiles.yml'
      - '.python-version'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixtures:
    name: Python and dbt fixture checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Check data logic without credentials or remote writes
        run: bash scripts/check-data.sh
