name: Validate data platform

on:
  pull_request:
    paths:
      - 'src/**'
      - 'config/**'
      - 'models/**'
      - 'macros/**'
      - 'tests/**'
      - 'scripts/**'
      - 'requirements.*'
      - 'dbt_project.yml'
      - '.dbtignore'
      - 'profiles.yml'
      - '.python-version'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixtures:
    name: Python and dbt fixture checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Export tracked source for offline PR review
        run: git archive --format=zip --output="$RUNNER_TEMP/bdl-pr-review-source.zip" HEAD
      - name: Retain temporary source review archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bdl-pr-review-source
          path: ${{ runner.temp }}/bdl-pr-review-source.zip
          retention-days: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - name: Inspect public BDL catalogue controls without authentication or data downloads
        timeout-minutes: 6
        run: |
          npm --prefix portal ci --ignore-scripts --no-audit --no-fund
          cd portal
          npx --no-install playwright install --with-deps chromium
          node --input-type=module <<'JS'
          import { chromium } from '@playwright/test';
          import fs from 'node:fs/promises';
          const out = `${process.env.RUNNER_TEMP}/bdl-catalogue-review`;
          await fs.mkdir(out, {recursive:true});
          const browser = await chromium.launch({headless:true});
          for (const id of [563,570,640]) {
            const page = await browser.newPage({locale:'pl-PL'});
            const summary = {id, url:`https://bdl.stat.gov.pl/bdl/metadane/podgrupy/${id}`};
            try {
              const response = await page.goto(summary.url,{waitUntil:'domcontentloaded',timeout:60000});
              summary.http_status = response?.status();
              await page.waitForTimeout(1200);
              summary.controls = await page.locator('a,button,input,select').evaluateAll(es => es.filter(e=>e.offsetWidth||e.offsetHeight).map(e=>({id:e.id,tag:e.tagName,cls:e.className,text:(e.innerText||e.value||'').slice(0,100),title:e.title,href:e.getAttribute('href')})));
              await fs.writeFile(`${out}/${id}.html`,await page.content());
              await page.screenshot({path:`${out}/${id}.png`,fullPage:true});
            } catch(e) {summary.error=String(e.message);}
            await fs.writeFile(`${out}/${id}.json`,JSON.stringify(summary,null,2));
            await page.close();
          }
          await browser.close();
          JS
      - name: Retain public catalogue diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bdl-catalogue-review
          path: ${{ runner.temp }}/bdl-catalogue-review
          retention-days: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Check workflow safety policy
        run: python scripts/check-workflows.py
      - name: Check data logic without credentials or remote writes
        run: bash scripts/check-data.sh
