name: GUS BDL data pipeline

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      stage:
        description: 'Pipeline stage to execute'
        type: choice
        default: all
        options: [all, ingest_only, transform_only]
      cycles:
        description: 'Consecutive collect-and-publish batches (registered BDL uses up to 60 req/cycle)'
        type: choice
        default: '6'
        options: ['1', '3', '6']
      pause_history:
        description: 'Collect recent data and metadata while leaving historical tasks checkpointed'
        type: boolean
        default: false
      retry_validation:
        description: 'Retry HTTP-200 parser rejections from older code; preserve provider backoff and quotas'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'src/source_campaign.py'
      - 'src/bdl_platform.py'
      - 'src/bdl_release_validation.py'
      - 'src/bdl_business_catalog.py'
      - 'src/bdl_semantic.py'
      - 'src/bdl_platform_contract.py'
      - 'src/bdl_bulk_ingest.py'
      - 'src/bdl_bulk_plan.py'
      - 'src/drive_release_store.py'
      - 'src/release_protocol.py'
      - 'src/storage_manager.py'
      - 'src/ingestion/sources/gus_bdl.py'
      - 'src/ingestion/source_campaign.py'
      - 'src/ingestion/source_campaign_store.py'
      - 'models/**/br_bdl_*'
      - 'models/**/stg_bdl_*'
      - 'models/**/dim_bdl_*'
      - 'models/**/fact_bdl_*'
      - 'models/**/mart_bdl_*'
      - 'models/**/bdl_*'
      - 'models/bdl_schema.yml'
      - 'models/semantic/bdl_metrics.yml'
      - 'portal/scripts/bdl-web-bulk-worker.mjs'
      - 'config/source-campaigns.yaml'
      - 'config/source-access.yaml'
      - 'config/sources.yaml'
      - '.github/workflows/source-gus-bdl.yml'

permissions:
  contents: read

concurrency:
  group: zohelo-pipeline-gus_bdl
  cancel-in-progress: false

jobs:
  ingest_landing:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_dispatch' || inputs.stage == 'all' || inputs.stage == 'ingest_only') &&
      (github.event_name != 'push' || contains(github.event.head_commit.message, '[run-source-campaigns]') || contains(github.event.head_commit.message, '[run-bdl]'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Ingest GUS BDL Landing batch (max throughput under registered quota)
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GUS_BDL_API_KEY: ${{ secrets.GUS_BDL_API_KEY }}
          CAMPAIGN_CYCLES: ${{ inputs.cycles || '6' }}
          CAMPAIGN_PAUSE_HISTORY: ${{ inputs.pause_history || 'false' }}
          CAMPAIGN_RETRY_VALIDATION: ${{ inputs.retry_validation || contains(github.event.head_commit.message, '[retry-source-validation]') || 'false' }}
        run: |
          args=(--source gus_bdl --backend drive --allow-production-write --summary campaign-summary.json --cycles "$CAMPAIGN_CYCLES")
          if [[ "$CAMPAIGN_PAUSE_HISTORY" == "true" ]]; then
            args+=(--pause-history)
          fi
          if [[ "$CAMPAIGN_RETRY_VALIDATION" == "true" ]]; then
            args+=(--retry-validation-failures)
          fi
          python src/source_campaign.py "${args[@]}"
      - name: Restore accepted evidence in fresh process
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: python src/source_campaign.py --source gus_bdl --backend drive --allow-production-write --verify-current
      - name: Restore and query published Landing in fresh process
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: python src/source_campaign.py --source gus_bdl --backend drive --allow-production-write --verify-landing

  platform_transform_and_release:
    needs: [ingest_landing]
    if: >-
      always() && !cancelled() &&
      github.ref == 'refs/heads/main' &&
      (inputs.stage == 'transform_only' || needs.ingest_landing.result == 'success') &&
      (github.event_name != 'push' || contains(github.event.head_commit.message, '[run-source-campaigns]') || contains(github.event.head_commit.message, '[run-bdl]'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Build, model, and publish BDL platform release (Bronze -> Silver -> Gold -> Semantic)
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: python src/bdl_platform.py --backend drive --allow-production-write
      - name: Verify current BDL modeled release in fresh process
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: python src/bdl_platform.py --backend drive --allow-production-write --verify-current

  web_bulk_backfill:
    needs: [platform_transform_and_release]
    if: >-
      always() && !cancelled() &&
      github.ref == 'refs/heads/main' &&
      needs.platform_transform_and_release.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || inputs.stage == 'all') &&
      (github.event_name != 'push' || contains(github.event.head_commit.message, '[run-source-campaigns]') || contains(github.event.head_commit.message, '[run-bdl]'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: '.python-version'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Confirm required BDL and Drive secrets are present
        env:
          GUS_BDL_WEB_EMAIL: ${{ secrets.GUS_BDL_WEB_EMAIL }}
          GUS_BDL_WEB_PASSWORD: ${{ secrets.GUS_BDL_WEB_PASSWORD }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: |
          test -n "$GUS_BDL_WEB_EMAIL"
          test -n "$GUS_BDL_WEB_PASSWORD"
          test -n "$GOOGLE_OAUTH_CLIENT_ID"
          test -n "$GOOGLE_OAUTH_CLIENT_SECRET"
          test -n "$GOOGLE_OAUTH_REFRESH_TOKEN"
      - name: Install browser dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium
      - name: Install pinned Python dependencies
        run: python -m pip install -r ../requirements.txt
      - name: Plan next unprocessed BDL subgroup
        id: plan
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GUS_BDL_API_KEY: ${{ secrets.GUS_BDL_API_KEY }}
          PYTHONPATH: ../src
        run: |
          mkdir -p test-results/bdl-web-bulk
          python ../src/bdl_bulk_plan.py plan --output test-results/bdl-web-bulk/plan.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          p = json.load(open('test-results/bdl-web-bulk/plan.json', encoding='utf-8'))
          c = p.get('candidate')
          print(f"has_candidate={'true' if c else 'false'}")
          if c:
              print(f"subgroup_id={c['subgroup_id']}")
              print(f"subgroup_url={c['url']}")
              name = (c.get('subgroup_name') or c['subgroup_id']).replace('\n', ' ').replace('\r', ' ')
              print(f"subgroup_name={name}")
          PY
      - name: Extract BDL subgroup through authenticated Web bulk
        if: steps.plan.outputs.has_candidate == 'true'
        env:
          GUS_BDL_WEB_EMAIL: ${{ secrets.GUS_BDL_WEB_EMAIL }}
          GUS_BDL_WEB_PASSWORD: ${{ secrets.GUS_BDL_WEB_PASSWORD }}
          BDL_BULK_SUBGROUP_ID: ${{ steps.plan.outputs.subgroup_id }}
          BDL_BULK_SUBGROUP_NAME: ${{ steps.plan.outputs.subgroup_name }}
          BDL_BULK_URL: ${{ steps.plan.outputs.subgroup_url }}
          BDL_BULK_OUT_DIR: test-results/bdl-web-bulk
        run: node scripts/bdl-web-bulk-worker.mjs
      - name: Land downloaded subgroup or checkpoint REST fallback
        if: steps.plan.outputs.has_candidate == 'true'
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          PYTHONPATH: ../src
          SUBGROUP_ID: ${{ steps.plan.outputs.subgroup_id }}
        run: |
          status="$(python - <<'PY'
          import json
          print(json.load(open('test-results/bdl-web-bulk/worker-result.json', encoding='utf-8'))['status'])
          PY
          )"
          case "$status" in
            downloaded_existing_export|downloaded_generated_export)
              archive="$(find test-results/bdl-web-bulk -maxdepth 1 -type f -name 'download-*.zip' -print -quit)"
              test -n "$archive"
              python ../src/bdl_bulk_ingest.py \
                --archive "$archive" \
                --subgroup "$SUBGROUP_ID" \
                --allow-production-write \
                --summary test-results/bdl-web-bulk/landing-summary.json
              ;;
            below_bulk_threshold|no_bulk_control|web_bulk_unsupported)
              detail="$(python - <<'PY'
          import json
          r = json.load(open('test-results/bdl-web-bulk/worker-result.json', encoding='utf-8'))
          print((r.get('detail') or f"selectedInformation={r.get('selectedInformation')}").replace('\n', ' '))
          PY
              )"
              python ../src/bdl_bulk_plan.py mark --subgroup "$SUBGROUP_ID" --status "$status" --detail "$detail"
              ;;
            *)
              echo "Unexpected BDL Web bulk status: $status" >&2
              exit 1
              ;;
          esac
      - name: Upload sanitized backfill evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bdl-web-bulk-backfill-evidence
          path: |
            portal/test-results/bdl-web-bulk/plan.json
            portal/test-results/bdl-web-bulk/worker-result.json
            portal/test-results/bdl-web-bulk/landing-summary.json
          if-no-files-found: warn
          retention-days: 3
