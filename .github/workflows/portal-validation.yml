name: Validate portal

on:
  pull_request:
    paths:
      - 'portal/**'
      - 'scripts/prepare_dbt_viewer.py'
      - 'requirements.txt'
      - '.python-version'
      - '.node-version'
      - '.github/workflows/portal-validation.yml'
      - '.github/workflows/deploy-portal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        base_path: ['./', '/zohelo-data/']
    env:
      DUCK_UI_BASEPATH: ${{ matrix.base_path }}
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up shared Python version
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install Python dependencies
        working-directory: .
        run: python -m pip install -r requirements.txt
      - name: Stage the generic dbt Docs viewer template
        working-directory: .
        run: |
          rm -rf portal/public/docs
          python scripts/prepare_dbt_viewer.py
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check Google client-ID mapping and secret isolation
        run: node scripts/check-google-env.mjs
      - name: Lint
        run: npm run lint
      - name: Production build and type check
        run: npm run build
      - name: Unit and engine regression tests
        run: npm test
      - name: Install test browser
        run: npx --no-install playwright install --with-deps chromium
      - name: Browser regressions for Drive, catalogue, SQL editing and saved-input recovery
        run: npm run test:e2e -- e2e/googleDrive.spec.ts e2e/publicInfo.spec.ts e2e/catalog-docs.spec.ts e2e/joins.spec.ts e2e/review.spec.ts --retries=0
      - name: Retain browser screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-browser-evidence-${{ strategy.job-index }}
          path: portal/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove staged dbt Docs viewer template
        if: always()
        working-directory: .
        run: rm -rf portal/public/docs
