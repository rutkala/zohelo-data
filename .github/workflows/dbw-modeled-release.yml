name: Publish modeled DBW release

on:
  workflow_dispatch:
    inputs:
      code_sha:
        description: "Exact reviewed main commit to publish"
        required: true
        type: string
      confirm:
        description: "Type publish-reviewed-dbw to confirm the production operation"
        required: true
        type: string
      drive_root_id:
        description: "Google Drive root folder ID (production)"
        required: false
        default: "1b9ucISOOUXQd6Ku-6qp6g373w9HJ2WOf"
        type: string

permissions:
  contents: read

jobs:
  prepare_build_validate_and_publish:
    name: Prepare, build, validate and publish
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.code_sha == github.sha &&
      inputs.confirm == 'publish-reviewed-dbw'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: zohelo-production-data
      cancel-in-progress: false
      queue: max
    env:
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      ZOHELO_ALLOW_PRODUCTION_WRITES: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Publish reviewed retained DBW as a modeled release
        env:
          DRIVE_ROOT_ID: ${{ inputs.drive_root_id }}
          EXPECTED_CODE_SHA: ${{ inputs.code_sha }}
        run: |
          python src/dbw_platform_release.py \
            --drive-root-id "$DRIVE_ROOT_ID" \
            --expected-code-sha "$EXPECTED_CODE_SHA" \
            --allow-production-write

  verify_fresh_consumer:
    name: Verify current release from a fresh runner
    needs: prepare_build_validate_and_publish
    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.code_sha == github.sha &&
      inputs.confirm == 'publish-reviewed-dbw' &&
      needs.prepare_build_validate_and_publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Independently restore and query the current modeled release
        env:
          DRIVE_ROOT_ID: ${{ inputs.drive_root_id }}
          EXPECTED_CODE_SHA: ${{ inputs.code_sha }}
        run: |
          python src/dbw_platform_release.py \
            --drive-root-id "$DRIVE_ROOT_ID" \
            --expected-code-sha "$EXPECTED_CODE_SHA" \
            --verify-current
