name: BDL Web UI export probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bdl-web-probe-export.yml'

permissions:
  contents: read

concurrency:
  group: zohelo-pipeline-gus_bdl
  cancel-in-progress: false

jobs:
  probe:
    if: contains(github.event.head_commit.message, '[probe-bdl-export]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - name: Install browser dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium
      - name: Probe table export and download relational CSV when exposed
        env:
          GUS_BDL_WEB_EMAIL: ${{ secrets.GUS_BDL_WEB_EMAIL }}
          GUS_BDL_WEB_PASSWORD: ${{ secrets.GUS_BDL_WEB_PASSWORD }}
        run: |
          mkdir -p test-results/bdl-export-probe
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          import path from 'node:path';
          const email=process.env.GUS_BDL_WEB_EMAIL, password=process.env.GUS_BDL_WEB_PASSWORD;
          if (!email || !password) throw new Error('Missing Web credentials');
          const safe=(v)=>String(v??'').replaceAll(email,'[REDACTED_EMAIL]').replaceAll(password,'[REDACTED_PASSWORD]');
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({acceptDownloads:true,locale:'pl-PL'});
          const page=await context.newPage();
          const controls=async(label)=>{
            const rows=await page.locator('input,button,a,select,li,span').evaluateAll(els=>els.filter(e=>!!(e.offsetWidth||e.offsetHeight||e.getClientRects().length)).map(e=>({tag:e.tagName,id:e.id||null,cls:typeof e.className==='string'?e.className:'',type:e.getAttribute('type'),value:e.getAttribute('value'),text:(e.textContent||'').trim().replace(/\s+/g,' ').slice(0,220),href:e.getAttribute('href'),disabled:'disabled' in e?!!e.disabled:false})).filter(x=>x.id||x.value||x.text));
            console.log(`EXPORT_${label}=`+safe(JSON.stringify(rows)));
          };
          try {
            await page.goto('https://bdl.stat.gov.pl/bdl/logowanie',{waitUntil:'domcontentloaded',timeout:45000});
            await page.locator('#ctl00_ContentPlaceHolder_Email').fill(email);
            await page.locator('#ctl00_ContentPlaceHolder_Password').fill(password);
            await page.locator('#ctl00_ContentPlaceHolder_SignIn').click();
            await page.waitForTimeout(1200);
            await page.goto('https://bdl.stat.gov.pl/bdl/dane/podgrup/wymiary/2/3/1319',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(900);
            const clicked=new Set();
            for(let round=0;round<20;round++){
              const list=await page.locator('[id$="_SelectAll"]').evaluateAll(els=>els.map(e=>({id:e.id,visible:!!(e.offsetWidth||e.offsetHeight||e.getClientRects().length),disabled:!!e.disabled})));
              const next=list.filter(x=>x.visible&&!x.disabled&&!clicked.has(x.id)).sort((a,b)=>a.id.localeCompare(b.id))[0];
              if(!next)break;
              await page.locator(`#${next.id}`).click(); clicked.add(next.id); await page.waitForTimeout(650);
            }
            await page.locator('#ctl00_ContentPlaceHolder_dalej1').click();
            await page.waitForTimeout(1100);
            await page.locator('#ctl00_ContentPlaceHolder_terytList_MenuButton').click();
            const selectAll=page.locator('li.rmItem').filter({hasText:'Zaznacz wszystkie'}).first().locator('.rmLink');
            if(!await selectAll.isVisible()) throw new Error('Select-all territorial menu action not visible');
            await selectAll.click();
            const next=page.locator('#ctl00_ContentPlaceHolder_dalej1');
            for(let attempt=0;attempt<20 && !(await next.isEnabled());attempt++) await page.waitForTimeout(500);
            const selectedBody=await page.locator('body').innerText();
            console.log('EXPORT_SELECTED_TERRITORIES=' + (selectedBody.match(/Wybranych elementów:\s*([0-9\s]+)/i)?.[1]?.replace(/\s/g,'') || 'unknown'));
            if(!await next.isEnabled()){
              await controls('AFTER_SELECT_ALL');
              throw new Error('Dalej remained disabled after selecting all territories');
            }
            await next.click();
            await page.waitForTimeout(2000);
            console.log('EXPORT_TABLE_URL='+page.url());
            await controls('TABLE');
            console.log('EXPORT_TABLE_BODY='+safe((await page.locator('body').innerText()).replace(/\s+/g,' ').slice(0,7000)));

            const exportCandidates=page.getByText(/Eksport|Export/i,{exact:true});
            if(await exportCandidates.count()){
              await exportCandidates.first().click();
              await page.waitForTimeout(700);
              await controls('MENU');
              console.log('EXPORT_MENU_BODY='+safe((await page.locator('body').innerText()).replace(/\s+/g,' ').slice(0,5000)));
            }
            const csv=page.getByText(/CSV[^\n]*relacyj/i).first();
            if(await csv.count() && await csv.isVisible()){
              const [download]=await Promise.all([
                page.waitForEvent('download',{timeout:60000}),
                csv.click(),
              ]);
              const target=path.resolve('test-results/bdl-export-probe/probe.zip');
              await download.saveAs(target);
              console.log('EXPORT_RELATIONAL_DOWNLOADED=true');
              console.log('EXPORT_SUGGESTED_FILENAME='+safe(download.suggestedFilename()));
            } else {
              console.log('EXPORT_RELATIONAL_DOWNLOADED=false');
            }
          } finally { await browser.close(); }
          NODE
      - name: Inspect downloaded archive schema
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv, io, zipfile
          p=Path('test-results/bdl-export-probe/probe.zip')
          if not p.exists():
              print('EXPORT_ARCHIVE_PRESENT=false')
              raise SystemExit(0)
          print('EXPORT_ARCHIVE_PRESENT=true')
          with zipfile.ZipFile(p) as z:
              names=[n for n in z.namelist() if not n.endswith('/')]
              print('EXPORT_MEMBERS=' + repr(names))
              csvs=[n for n in names if n.lower().endswith('.csv')]
              if len(csvs)!=1:
                  print('EXPORT_CSV_MEMBER_COUNT=' + str(len(csvs)))
                  raise SystemExit(0)
              raw=z.read(csvs[0])
          text=None
          for enc in ('utf-8-sig','cp1250','iso-8859-2'):
              try:
                  text=raw.decode(enc)
                  print('EXPORT_ENCODING='+enc)
                  break
              except UnicodeDecodeError:
                  pass
          if text is None:
              print('EXPORT_ENCODING=unknown')
              raise SystemExit(0)
          sample=text[:200000]
          dialect=None
          try:
              dialect=csv.Sniffer().sniff(sample[:20000], delimiters=';,\t|')
          except csv.Error:
              pass
          delimiter=dialect.delimiter if dialect else ';'
          rows=csv.reader(io.StringIO(sample), delimiter=delimiter)
          header=next(rows, [])
          first=next(rows, [])
          print('EXPORT_DELIMITER=' + repr(delimiter))
          print('EXPORT_HEADER=' + repr(header))
          print('EXPORT_FIRST_ROW_WIDTH=' + str(len(first)))
          print('EXPORT_FIRST_ROW=' + repr(first[:20]))
          PY
