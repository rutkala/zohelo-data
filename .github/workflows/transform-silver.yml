name: Silver Layer Transformation

on:
  push:
    branches: [main]
    paths:
      - 'src/transformation/silver_builder.py'
      - 'src/release_protocol.py'
      - 'src/drive_release_store.py'
      - 'models/**'
      - '.github/workflows/transform-silver.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ["Bronze Layer Transformation"]
    types:
      - completed

concurrency:
  group: zohelo-production-data
  cancel-in-progress: false

jobs:
  transform:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-nbp-silver]')))
    name: Run Silver Layer Transformation
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up shared Python version
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Run Silver Layer Transformation
        id: publish
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: |
          python src/transformation/silver_builder.py

      - name: Restore and query the release in a fresh process
        env:
          ZOHELO_EXPECTED_RELEASE_ID: ${{ steps.publish.outputs.release_id }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: python scripts/check_current_silver_release.py
