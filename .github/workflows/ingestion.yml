name: Ingestion

on:
  schedule:
    - cron: '0 2 * * *'
    - cron: '25 */6 * * *'
    - cron: '12 * * * *'
  workflow_dispatch:
    inputs:
      source:
        description: Source to ingest
        type: choice
        default: nbp
        options: [nbp, bdl, dbw, dbw_api, world_bank, eurostat]
      mode:
        description: NBP mode; other sources resume their checkpoints
        type: choice
        default: incremental
        options: [incremental, full, rebuild]

permissions:
  contents: read

concurrency:
  group: zohelo-production-data
  cancel-in-progress: false
  queue: max

jobs:
  ingest:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      SOURCE: ${{ inputs.source || (github.event.schedule == '0 2 * * *' && 'nbp') || (github.event.schedule == '25 */6 * * *' && 'world_bank') || 'eurostat' }}
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: src
      DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
    steps:
      - name: Record BDL session start
        if: env.SOURCE == 'bdl'
        run: echo "BDL_JOB_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install data dependencies
        run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: env.SOURCE == 'bdl'
        with:
          node-version-file: .node-version
      - name: Install BDL browser and VPN runtime
        if: env.SOURCE == 'bdl'
        run: |
          npm --prefix portal ci --ignore-scripts --no-audit --no-fund
          (cd portal && npx --no-install playwright install --with-deps chromium)
          GOTOOLCHAIN=go1.26.0 GOSUMDB=sum.golang.org GONOSUMDB= GOPRIVATE= GOPROXY=https://proxy.golang.org go install github.com/windtf/wireproxy/cmd/wireproxy@v1.1.3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Ingest the selected source
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GUS_DBW_API_KEY: ${{ secrets.GUS_DBW_API_KEY }}
          GUS_BDL_WEB_EMAIL: ${{ secrets.GUS_BDL_WEB_EMAIL }}
          GUS_BDL_WEB_PASSWORD: ${{ secrets.GUS_BDL_WEB_PASSWORD }}
          ZOHELO_WORKER1: ${{ secrets.ZOHELO_WORKER1 }}
          ZOHELO_WORKER2: ${{ secrets.ZOHELO_WORKER2 }}
          ZOHELO_WORKER3: ${{ secrets.ZOHELO_WORKER3 }}
          ZOHELO_WORKER4: ${{ secrets.ZOHELO_WORKER4 }}
          ZOHELO_WORKER5: ${{ secrets.ZOHELO_WORKER5 }}
          ZOHELO_WORKER6: ${{ secrets.ZOHELO_WORKER6 }}
          ZOHELO_WORKER7: ${{ secrets.ZOHELO_WORKER7 }}
          ZOHELO_WORKER8: ${{ secrets.ZOHELO_WORKER8 }}
          ZOHELO_WORKER9: ${{ secrets.ZOHELO_WORKER9 }}
          ZOHELO_WORKER10: ${{ secrets.ZOHELO_WORKER10 }}
          NBP_MODE: ${{ inputs.mode || 'incremental' }}
        run: |
          case "$SOURCE" in
            nbp)
              python src/nbp_platform.py --mode "$NBP_MODE"
              ;;
            bdl)
              python scripts/multi_vpn_manager.py -- \
                python src/bdl_web_adaptive.py --workspace "$RUNNER_TEMP/bdl-ingestion" \
                --mode resume --max-seconds @BDL_BUDGET@ \
                --concurrency 10 --require-proxy-count 10
              ;;
            dbw)
              python src/dbw_web_extractor.py --workspace "$RUNNER_TEMP/dbw-ingestion" \
                --concurrency 3 --max-seconds 12600 --summary "$RUNNER_TEMP/dbw-summary.json"
              ;;
            dbw_api)
              python src/source_campaign.py --source gus_dbw --backend drive \
                --allow-production-write --cycles 3 --session-seconds 900
              ;;
            world_bank|eurostat)
              source_id="$SOURCE"
              if [[ "$SOURCE" == world_bank ]]; then source_id=world_bank_wdi; fi
              python src/source_campaign.py --source "$source_id" --backend drive \
                --allow-production-write --cycles 1 --session-seconds 900
              python src/source_campaign.py --source "$source_id" --backend drive \
                --allow-production-write --verify-state
              python src/full_source_campaign.py --source "$source_id" --allow-production-write
              ;;
            *) echo 'Unknown source' >&2; exit 1 ;;
          esac
