name: Ingestion (R2 manual)

on:
  workflow_dispatch:
    inputs:
      operation:
        description: What to run
        required: true
        type: choice
        default: smoke
        options:
          - smoke
          - campaign
          - bulk
      source:
        description: Source for campaign/bulk operations
        required: true
        type: choice
        default: world_bank_wdi
        options:
          - world_bank_wdi
          - eurostat
          - gus_bdl
          - gus_dbw
      cycles:
        description: Standard campaign batches (1-6)
        required: false
        default: "1"
      session_seconds:
        description: Runtime budget in seconds
        required: false
        default: "600"
      max_requests:
        description: Bulk requests per run
        required: false
        default: "12"

permissions:
  contents: read

concurrency:
  group: zohelo-r2-ingestion-${{ inputs.source || 'smoke' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: src
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      R2_S3_ENDPOINT: ${{ vars.R2_S3_ENDPOINT }}
      R2_LANDING_BUCKET: ${{ vars.R2_LANDING_BUCKET }}
      R2_LAKEHOUSE_BUCKET: ${{ vars.R2_LAKEHOUSE_BUCKET }}
      GUS_BDL_API_KEY: ${{ secrets.GUS_BDL_API_KEY }}
      GUS_DBW_API_KEY: ${{ secrets.GUS_DBW_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
      - name: Install ingestion dependencies
        run: python -m pip install boto3 pyyaml requests
      - name: Verify R2 ingestion backends
        if: inputs.operation == 'smoke'
        run: |
          set -euo pipefail
          python scripts/r2-campaign-store-smoke.py
          python scripts/r2-bulk-store-smoke.py
      - name: Run standard source campaign into R2
        if: inputs.operation == 'campaign'
        env:
          SOURCE: ${{ inputs.source }}
          CYCLES: ${{ inputs.cycles }}
          SESSION_SECONDS: ${{ inputs.session_seconds }}
        run: |
          set -euo pipefail
          case "$CYCLES" in
            1|2|3|4|5|6) ;;
            *) echo "cycles must be 1-6" >&2; exit 2 ;;
          esac
          case "$SESSION_SECONDS" in
            ''|*[!0-9]*) echo "session_seconds must be numeric" >&2; exit 2 ;;
          esac
          if [ "$SESSION_SECONDS" -lt 60 ] || [ "$SESSION_SECONDS" -gt 1800 ]; then
            echo "session_seconds must be 60-1800" >&2
            exit 2
          fi
          python src/source_campaign.py             --backend r2             --source "$SOURCE"             --allow-production-write             --cycles "$CYCLES"             --session-seconds "$SESSION_SECONDS"
      - name: Run full-distribution source campaign into R2
        if: inputs.operation == 'bulk'
        env:
          SOURCE: ${{ inputs.source }}
          SESSION_SECONDS: ${{ inputs.session_seconds }}
          MAX_REQUESTS: ${{ inputs.max_requests }}
        run: |
          set -euo pipefail
          case "$SOURCE" in
            world_bank_wdi|eurostat) ;;
            *) echo "bulk operation currently supports world_bank_wdi or eurostat" >&2; exit 2 ;;
          esac
          case "$SESSION_SECONDS" in
            ''|*[!0-9]*) echo "session_seconds must be numeric" >&2; exit 2 ;;
          esac
          case "$MAX_REQUESTS" in
            ''|*[!0-9]*) echo "max_requests must be numeric" >&2; exit 2 ;;
          esac
          if [ "$SESSION_SECONDS" -lt 60 ] || [ "$SESSION_SECONDS" -gt 2400 ]; then
            echo "session_seconds must be 60-2400" >&2
            exit 2
          fi
          if [ "$MAX_REQUESTS" -lt 1 ] || [ "$MAX_REQUESTS" -gt 100 ]; then
            echo "max_requests must be 1-100" >&2
            exit 2
          fi
          python src/full_source_campaign.py             --source "$SOURCE"             --allow-production-write             --session-seconds "$SESSION_SECONDS"             --max-requests "$MAX_REQUESTS"
