name: Ingestion (paused for R2 cutover)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paused:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: R2 cutover hold
        run: |
          echo "Source ingestion is paused while production writers are migrated from Google Drive to Cloudflare R2."
          echo "This workflow performs no ingestion, transformation, Google Drive write, or R2 write."
