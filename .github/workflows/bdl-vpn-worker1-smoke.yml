name: BDL VPN worker1 smoke test

on:
  workflow_dispatch:
  push:
    branches:
      - test/bdl-github-vpn-worker1
    paths:
      - .github/workflows/bdl-vpn-worker1-smoke.yml

permissions:
  contents: read

jobs:
  vpn_smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ZOHELO_WORKER1: ${{ secrets.ZOHELO_WORKER1 }}
    steps:
      - name: Validate worker secret
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ZOHELO_WORKER1:-}" ]; then
            echo "ZOHELO_WORKER1 is missing or empty."
            exit 1
          fi
          if [[ "$ZOHELO_WORKER1" == *"[Interface]"* && "$ZOHELO_WORKER1" == *"[Peer]"* && "$ZOHELO_WORKER1" == *"PrivateKey"* ]]; then
            echo "ZOHELO_WORKER1 contains a complete WireGuard config."
          elif [[ "$ZOHELO_WORKER1" =~ ^[A-Za-z0-9+/]{43}=$ ]]; then
            echo "ZOHELO_WORKER1 contains a WireGuard private key."
          else
            echo "ZOHELO_WORKER1 exists, but is neither a complete WireGuard config nor a valid-looking WireGuard private key."
            exit 1
          fi

      - name: Install pinned wireproxy
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/windtf/wireproxy/cmd/wireproxy@v1.1.3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build temporary worker1 proxy config
        shell: bash
        run: |
          set -euo pipefail
          CONF="$RUNNER_TEMP/zohelo-worker1.conf"
          umask 077
          if [[ "$ZOHELO_WORKER1" == *"[Interface]"* && "$ZOHELO_WORKER1" == *"[Peer]"* ]]; then
            printf '%s\n' "$ZOHELO_WORKER1" > "$CONF"
          else
            {
              printf '%s\n' '[Interface]'
              printf 'PrivateKey = %s\n' "$ZOHELO_WORKER1"
              printf '%s\n' 'Address = 10.2.0.2/32, 2a07:b944::2:2/128'
              printf '%s\n' 'DNS = 10.2.0.1, 2a07:b944::2:1'
              printf '\n%s\n' '[Peer]'
              printf '%s\n' 'PublicKey = wpfRQRhJirL++QclFH6SDhc+TuJJB4UxbCABy7A1tS4='
              printf '%s\n' 'AllowedIPs = 0.0.0.0/0, ::/0'
              printf '%s\n' 'Endpoint = 79.127.186.193:51820'
              printf '%s\n' 'PersistentKeepalive = 25'
            } > "$CONF"
          fi
          cat >> "$CONF" <<'EOF'

          [http]
          BindAddress = 127.0.0.1:8081

          [Socks5]
          BindAddress = 127.0.0.1:1081
          EOF
          chmod 600 "$CONF"
          echo "WIREPROXY_CONF=$CONF" >> "$GITHUB_ENV"

      - name: Start worker1 VPN proxy
        shell: bash
        run: |
          set -euo pipefail
          wireproxy -c "$WIREPROXY_CONF" >"$RUNNER_TEMP/wireproxy.log" 2>&1 &
          echo "WIREPROXY_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 25); do
            if ! kill -0 "$!" 2>/dev/null; then
              echo "wireproxy exited before the proxy became ready."
              sed -E \
                -e 's/(PrivateKey[[:space:]]*=[[:space:]]*)[^[:space:]]+/\1[REDACTED]/g' \
                -e 's/[A-Za-z0-9+\\/]{43}=/[KEY_REDACTED]/g' \
                "$RUNNER_TEMP/wireproxy.log" | tail -80
              exit 1
            fi
            if curl --silent --show-error --fail --max-time 5               --proxy http://127.0.0.1:8081 https://api.ipify.org               >"$RUNNER_TEMP/proxy-ip.txt"; then
              exit 0
            fi
            sleep 1
          done
          echo "worker1 proxy did not become reachable."
          sed -E \
            -e 's/(PrivateKey[[:space:]]*=[[:space:]]*)[^[:space:]]+/\1[REDACTED]/g' \
            -e 's/[A-Za-z0-9+\\/]{43}=/[KEY_REDACTED]/g' \
            "$RUNNER_TEMP/wireproxy.log" | tail -80
          exit 1

      - name: Verify isolated VPN egress and BDL reachability
        shell: bash
        run: |
          set -euo pipefail
          DIRECT_IP="$(curl --silent --show-error --fail --max-time 10 https://api.ipify.org)"
          PROXY_IP="$(cat "$RUNNER_TEMP/proxy-ip.txt")"
          test -n "$DIRECT_IP"
          test -n "$PROXY_IP"
          if [ "$DIRECT_IP" = "$PROXY_IP" ]; then
            echo "VPN test failed: proxy egress matches direct runner egress."
            exit 1
          fi
          STATUS="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}'             --max-time 20 --proxy http://127.0.0.1:8081 https://bdl.stat.gov.pl/)"
          case "$STATUS" in
            2*|3*) ;;
            *)
              echo "BDL reachability failed through worker1 proxy: HTTP $STATUS"
              exit 1
              ;;
          esac
          echo "worker1 VPN smoke test passed."
          echo "Direct runner egress and VPN egress are distinct."
          echo "BDL is reachable through the worker1 VPN proxy."

      - name: Stop worker1 VPN proxy
        if: always()
        shell: bash
        run: |
          if [ -n "${WIREPROXY_PID:-}" ]; then
            kill "$WIREPROXY_PID" 2>/dev/null || true
          fi
          rm -f "${WIREPROXY_CONF:-}" "$RUNNER_TEMP/proxy-ip.txt" "$RUNNER_TEMP/wireproxy.log"
