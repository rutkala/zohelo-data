name: DBW retained Bronze release preflight

on:
  workflow_dispatch:
    inputs:
      drive_root_id:
        description: "Google Drive root folder ID (production)"
        required: false
        default: "1b9ucISOOUXQd6Ku-6qp6g373w9HJ2WOf"

permissions:
  contents: read

concurrency:
  group: zohelo-dbw-preflight
  cancel-in-progress: false

jobs:
  restore_reviewed_inputs:
    name: Restore and validate reviewed DBW inputs
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      DRIVE_ROOT_ID: ${{ inputs.drive_root_id || '1b9ucISOOUXQd6Ku-6qp6g373w9HJ2WOf' }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore and validate reviewed DBW audit inputs
        run: |
          python scripts/prepare_retained_dbw_release.py \
            --drive-root-id "$DRIVE_ROOT_ID" \
            --output "$RUNNER_TEMP/dbw-preflight"

      - name: Upload restore evidence (summaries only)
        uses: actions/upload-artifact@v4
        with:
          name: dbw-preflight-evidence
          path: |
            ${{ runner.temp }}/dbw-preflight/restore-evidence.json
            ${{ runner.temp }}/dbw-preflight/fresh-audit-report.json
            ${{ runner.temp }}/dbw-preflight/audit/run-status.json
          retention-days: 30
