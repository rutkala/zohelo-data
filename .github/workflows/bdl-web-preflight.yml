name: BDL ten-route credential and network preflight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/bdl-web-preflight.yml
      - .github/workflows/bdl-web-bootstrap.yml
      - scripts/multi_vpn_manager.py
      - portal/scripts/bdl-vpn-preflight.mjs
      - portal/scripts/bdl-web-proxy.mjs
      - src/bdl_web_adaptive.py
      - scripts/bdl_continuation.py

permissions:
  contents: read

concurrency:
  group: zohelo-pipeline-gus_bdl
  cancel-in-progress: false
  queue: max

jobs:
  verify_routes:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - name: Install pinned browser and verified wireproxy module
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          npm --prefix portal ci --ignore-scripts --no-audit --no-fund
          (cd portal && npx --no-install playwright install --with-deps chromium)
          command -v go
          GOTOOLCHAIN=go1.26.0 GOSUMDB=sum.golang.org GONOSUMDB= GOPRIVATE= GOPROXY=https://proxy.golang.org go install github.com/windtf/wireproxy/cmd/wireproxy@v1.1.3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Verify ten browser VPN routes and BDL access (read-only)
        env:
          ZOHELO_WORKER1: ${{ secrets.ZOHELO_WORKER1 }}
          ZOHELO_WORKER2: ${{ secrets.ZOHELO_WORKER2 }}
          ZOHELO_WORKER3: ${{ secrets.ZOHELO_WORKER3 }}
          ZOHELO_WORKER4: ${{ secrets.ZOHELO_WORKER4 }}
          ZOHELO_WORKER5: ${{ secrets.ZOHELO_WORKER5 }}
          ZOHELO_WORKER6: ${{ secrets.ZOHELO_WORKER6 }}
          ZOHELO_WORKER7: ${{ secrets.ZOHELO_WORKER7 }}
          ZOHELO_WORKER8: ${{ secrets.ZOHELO_WORKER8 }}
          ZOHELO_WORKER9: ${{ secrets.ZOHELO_WORKER9 }}
          ZOHELO_WORKER10: ${{ secrets.ZOHELO_WORKER10 }}
        run: python scripts/multi_vpn_manager.py --preflight
