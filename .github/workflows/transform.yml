name: Transformations (R2 Iceberg cutover)

on:
  push:
    branches: [main]
    paths:
      - 'scripts/migrate-r2-iceberg.py'
      - '.github/workflows/transform.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zohelo-r2-iceberg-cutover
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
      - name: Install Iceberg migration dependencies
        run: python -m pip install "pyiceberg==0.12.0" "pyarrow==20.0.0" boto3
      - name: Consolidate production R2 Parquet into Iceberg
        env:
          R2_DATA_CATALOG_TOKEN: ${{ secrets.R2_DATA_CATALOG_TOKEN }}
          R2_CATALOG_URI: ${{ vars.R2_CATALOG_URI }}
          R2_WAREHOUSE: ${{ vars.R2_WAREHOUSE }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          R2_S3_ENDPOINT: ${{ vars.R2_S3_ENDPOINT }}
          R2_LAKEHOUSE_BUCKET: ${{ vars.R2_LAKEHOUSE_BUCKET }}
        run: |
          set -euo pipefail
          python scripts/migrate-r2-iceberg.py --receipt "$RUNNER_TEMP/r2-iceberg-cutover.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r2-iceberg-cutover-${{ github.run_id }}
          path: ${{ runner.temp }}/r2-iceberg-cutover.json
          retention-days: 30
