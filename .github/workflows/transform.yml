name: Transformations

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Transform or publish retained data; no source ingestion
        type: choice
        default: world_bank
        options: [world_bank, eurostat_modeled, eurostat_bronze, dbw_modeled, dbw_bronze, opendata_bronze]
      category:
        description: OpenData category; ignored for other operations
        type: choice
        default: organizations
        options: [organizations, locations, people]
      drive_root_id:
        description: DBW Drive root; ignored for other operations
        type: string
        default: '1b9ucISOOUXQd6Ku-6qp6g373w9HJ2WOf'

permissions:
  contents: read

concurrency:
  group: zohelo-production-data
  cancel-in-progress: false
  queue: max

jobs:
  transform:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    # Retained DBW publication uses the existing repository-backed writer lock.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install data dependencies
        run: python -m pip install -r requirements.txt
      - name: Run the selected transformation
        env:
          OPERATION: ${{ inputs.operation }}
          CATEGORY: ${{ inputs.category }}
          DRIVE_ROOT_ID: ${{ inputs.drive_root_id }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GH_TOKEN: ${{ inputs.operation == 'dbw_bronze' && github.token || '' }}
          ZOHELO_ALLOW_PRODUCTION_WRITES: 'true'
          PYTHONUNBUFFERED: '1'
          DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
        run: |
          case "$OPERATION" in
            world_bank)
              python src/wdi_platform.py --allow-production-write
              ;;
            eurostat_modeled)
              python src/eurostat_platform.py --allow-production-write
              ;;
            eurostat_bronze)
              timeout --signal=INT --kill-after=60s 2700s \
                python src/eurostat_bulk_bronze.py --allow-production-write \
                --max-distributions 64 --session-seconds 2400
              ;;
            dbw_modeled)
              python src/dbw_platform_release.py --drive-root-id "$DRIVE_ROOT_ID" \
                --expected-code-sha "$GITHUB_SHA" --allow-production-write
              ;;
            dbw_bronze)
              gh auth setup-git
              git config user.name 'Zohelo DBW release'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              python scripts/prepare_retained_dbw_release.py \
                --drive-root-id "$DRIVE_ROOT_ID" --output "$RUNNER_TEMP/dbw-inputs"
              python scripts/publish_retained_dbw_bronze.py \
                --audit-dir "$RUNNER_TEMP/dbw-inputs/audit" \
                --workspace "$RUNNER_TEMP/dbw-publication" \
                --backend drive --drive-root-id "$DRIVE_ROOT_ID" \
                --allow-production-write --expected-code-sha "$GITHUB_SHA" --until-complete
              ;;
            opendata_bronze)
              case "$CATEGORY" in organizations|locations|people) ;; *) exit 1 ;; esac
              python src/ingestion/sources/opendata_bronze_loader.py \
                --category "$CATEGORY" --max-files 0 --allow-production-write
              python scripts/publish_opendata_bronze.py \
                --category "$CATEGORY" --allow-production-write
              ;;
            *) echo 'Unknown operation' >&2; exit 1 ;;
          esac
