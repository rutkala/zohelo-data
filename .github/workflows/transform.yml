name: Transformations (paused for R2 cutover)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paused:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: R2 cutover hold
        run: |
          echo "Drive-era transformations/publication are paused while the R2/Iceberg lakehouse is rebuilt."
          echo "This workflow performs no ingestion, transformation, Google Drive write, or R2 write."
