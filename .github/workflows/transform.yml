name: Transformations (R2 manual)

on:
  push:
    branches: [main]
    paths:
      - 'scripts/reconcile-r2-medallion.py'
      - 'scripts/reconcile-teryt-r2.py'
      - '.github/workflows/transform.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zohelo-r2-transform
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
      - name: Install reconciliation dependencies
        run: python -m pip install "pyiceberg==0.12.0" boto3 s3fs
      - name: Reconcile live R2 Landing and Iceberg
        env:
          R2_DATA_CATALOG_TOKEN: ${{ secrets.R2_DATA_CATALOG_TOKEN }}
          R2_CATALOG_URI: ${{ vars.R2_CATALOG_URI }}
          R2_WAREHOUSE: ${{ vars.R2_WAREHOUSE }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          R2_S3_ENDPOINT: ${{ vars.R2_S3_ENDPOINT }}
          R2_LANDING_BUCKET: ${{ vars.R2_LANDING_BUCKET }}
          R2_LAKEHOUSE_BUCKET: ${{ vars.R2_LAKEHOUSE_BUCKET }}
          RECONCILIATION_JSON: ${{ runner.temp }}/r2-reconciliation.json
          RECONCILIATION_MD: ${{ runner.temp }}/r2-reconciliation.md
        run: python scripts/reconcile-r2-medallion.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r2-medallion-reconciliation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/r2-reconciliation.json
            ${{ runner.temp }}/r2-reconciliation.md
          retention-days: 30

  teryt_lineage:
    if: github.event_name == 'push'
    needs: reconcile
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
      - name: Install TERYT reconciliation dependencies
        run: python -m pip install "pyiceberg==0.12.0" "pyarrow==20.0.0" boto3 s3fs duckdb google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib python-dotenv pyyaml
      - name: Prove TERYT Landing to Bronze lineage
        env:
          PYTHONPATH: src
          R2_DATA_CATALOG_TOKEN: ${{ secrets.R2_DATA_CATALOG_TOKEN }}
          R2_CATALOG_URI: ${{ vars.R2_CATALOG_URI }}
          R2_WAREHOUSE: ${{ vars.R2_WAREHOUSE }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          R2_S3_ENDPOINT: ${{ vars.R2_S3_ENDPOINT }}
          R2_LANDING_BUCKET: ${{ vars.R2_LANDING_BUCKET }}
          R2_LAKEHOUSE_BUCKET: ${{ vars.R2_LAKEHOUSE_BUCKET }}
        run: python scripts/reconcile-teryt-r2.py

  promote:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
      - name: Install R2 transformation dependencies
        run: python -m pip install "pyiceberg==0.12.0" "pyarrow==20.0.0" boto3 requests
      - name: Promote current R2 data through Silver and Gold
        env:
          R2_DATA_CATALOG_TOKEN: ${{ secrets.R2_DATA_CATALOG_TOKEN }}
          R2_CATALOG_URI: ${{ vars.R2_CATALOG_URI }}
          R2_WAREHOUSE: ${{ vars.R2_WAREHOUSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          R2_S3_ENDPOINT: ${{ vars.R2_S3_ENDPOINT }}
          R2_LAKEHOUSE_BUCKET: ${{ vars.R2_LAKEHOUSE_BUCKET }}
        run: python scripts/promote-current-r2.py
      - name: Keep pass-through promotions zero-copy
        env:
          R2_DATA_CATALOG_TOKEN: ${{ secrets.R2_DATA_CATALOG_TOKEN }}
          R2_CATALOG_URI: ${{ vars.R2_CATALOG_URI }}
          R2_WAREHOUSE: ${{ vars.R2_WAREHOUSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          R2_S3_ENDPOINT: ${{ vars.R2_S3_ENDPOINT }}
          R2_LAKEHOUSE_BUCKET: ${{ vars.R2_LAKEHOUSE_BUCKET }}
        run: python scripts/optimize-r2-promotions.py
