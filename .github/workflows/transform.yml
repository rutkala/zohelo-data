name: Transformations (R2 manual)

on:
  push:
    branches: [main]
    paths:
      - 'scripts/reconcile-r2-medallion.py'
      - '.github/workflows/transform.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zohelo-r2-transform
  cancel-in-progress: false

jobs:
  reconcile_snapshot:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
      - name: Install reconciliation dependencies
        run: python -m pip install "pyiceberg==0.12.0" boto3 s3fs
      - name: Reconcile live R2 state
        env:
          R2_DATA_CATALOG_TOKEN: ${{ secrets.R2_DATA_CATALOG_TOKEN }}
          R2_CATALOG_URI: ${{ vars.R2_CATALOG_URI }}
          R2_WAREHOUSE: ${{ vars.R2_WAREHOUSE }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          R2_S3_ENDPOINT: ${{ vars.R2_S3_ENDPOINT }}
          R2_LANDING_BUCKET: ${{ vars.R2_LANDING_BUCKET }}
          R2_LAKEHOUSE_BUCKET: ${{ vars.R2_LAKEHOUSE_BUCKET }}
          RECONCILIATION_JSON: ${{ runner.temp }}/r2-reconciliation.json
          RECONCILIATION_MD: ${{ runner.temp }}/r2-reconciliation.md
        run: |
          python scripts/reconcile-r2-medallion.py >/dev/null
          python - <<'PY'
          import json, os
          with open(os.environ["RECONCILIATION_JSON"], encoding="utf-8") as handle:
              report=json.load(handle)
          compact={}
          for source,item in report["sources"].items():
              compact[source]={
                  "landing_objects":item["landing"].get("objects",0),
                  "landing_bytes":item["landing"].get("bytes",0),
                  "archive_objects":item["archive"].get("objects",0),
                  "bronze_tables":item["layers"]["bronze"].get("tables",0),
                  "silver_tables":item["layers"]["silver"].get("tables",0),
                  "gold_tables":item["layers"]["gold"].get("tables",0),
                  "coverage":item["status"]["coverage_status"],
              }
          print(json.dumps({"observed_at_utc":report["observed_at_utc"],"sources":compact},sort_keys=True))
          PY

  promote:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
      - name: Install R2 transformation dependencies
        run: python -m pip install "pyiceberg==0.12.0" "pyarrow==20.0.0" boto3 requests
      - name: Promote current R2 data through Silver and Gold
        env:
          R2_DATA_CATALOG_TOKEN: ${{ secrets.R2_DATA_CATALOG_TOKEN }}
          R2_CATALOG_URI: ${{ vars.R2_CATALOG_URI }}
          R2_WAREHOUSE: ${{ vars.R2_WAREHOUSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          R2_S3_ENDPOINT: ${{ vars.R2_S3_ENDPOINT }}
          R2_LAKEHOUSE_BUCKET: ${{ vars.R2_LAKEHOUSE_BUCKET }}
        run: python scripts/promote-current-r2.py
      - name: Keep pass-through promotions zero-copy
        env:
          R2_DATA_CATALOG_TOKEN: ${{ secrets.R2_DATA_CATALOG_TOKEN }}
          R2_CATALOG_URI: ${{ vars.R2_CATALOG_URI }}
          R2_WAREHOUSE: ${{ vars.R2_WAREHOUSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          R2_S3_ENDPOINT: ${{ vars.R2_S3_ENDPOINT }}
          R2_LAKEHOUSE_BUCKET: ${{ vars.R2_LAKEHOUSE_BUCKET }}
        run: python scripts/optimize-r2-promotions.py
