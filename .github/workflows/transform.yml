name: Transformations (R2 manual)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/transform.yml']
  workflow_dispatch:
    inputs:
      operation:
        description: Existing R2 data operation (no provider ingestion)
        type: choice
        default: promote
        options: [promote, reconcile-eurostat, inspect-retained]

permissions:
  contents: read

concurrency:
  group: zohelo-r2-transform
  cancel-in-progress: false

jobs:
  reconcile_eurostat:
    if: github.event_name == 'push' || inputs.operation == 'reconcile-eurostat' || inputs.operation == 'inspect-retained'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONPATH: src
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      R2_DATA_CATALOG_TOKEN: ${{ secrets.R2_DATA_CATALOG_TOKEN }}
      R2_CATALOG_URI: ${{ vars.R2_CATALOG_URI }}
      R2_WAREHOUSE: ${{ vars.R2_WAREHOUSE }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      R2_S3_ENDPOINT: ${{ vars.R2_S3_ENDPOINT }}
      R2_LANDING_BUCKET: ${{ vars.R2_LANDING_BUCKET }}
      R2_LAKEHOUSE_BUCKET: ${{ vars.R2_LAKEHOUSE_BUCKET }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
      - name: Install reconciliation dependencies
        run: python -m pip install "duckdb==1.5.5" "pandas==3.0.5" "pyiceberg==0.12.0" "pyarrow==20.0.0" boto3 requests s3fs
      - name: Inspect retained inputs and existing table lineage
        run: python scripts/inspect-retained-reconciliation-r2.py --output "$RUNNER_TEMP/retained-reconciliation-inventory.json"
      - name: Preserve retained input inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: retained-reconciliation-inventory-${{ github.run_id }}
          path: ${{ runner.temp }}/retained-reconciliation-inventory.json
          retention-days: 7
      - name: Reconcile accepted Eurostat distributions from R2
        if: inputs.operation != 'inspect-retained'
        run: |
          python - <<'PY'
          import json, subprocess, sys, time
          deadline = time.monotonic() + 18000
          for batch in range(1, 129):
              remaining = int(deadline - time.monotonic())
              if remaining < 180:
                  print(json.dumps({"result": "incomplete", "reason": "bounded_session_finished", "next": "resume_from_iceberg_membership"}), flush=True)
                  sys.exit(2)
              print(json.dumps({"operation": "retained_eurostat_batch", "batch": batch}), flush=True)
              result = subprocess.run([sys.executable, "scripts/catch-up-eurostat-r2-bronze.py", "--max-distributions", "64", "--session-seconds", str(min(900, remaining-120))], text=True, stdout=subprocess.PIPE, timeout=remaining)
              print(result.stdout, end="", flush=True)
              if result.returncode:
                  sys.exit(result.returncode)
              receipts = []
              for line in result.stdout.splitlines():
                  try:
                      item = json.loads(line)
                  except ValueError:
                      continue
                  if item.get("operation") == "catch-up-eurostat-r2-bronze" and item.get("result") == "pass":
                      receipts.append(item)
              if len(receipts) != 1:
                  raise RuntimeError("Eurostat batch has no unambiguous completion receipt")
              receipt = receipts[0]
              if receipt.get("missing_distinct_raw_sha256") == 0:
                  print(json.dumps({"result": "accepted_current_distributions_complete", "scope": "eurostat_bulk_current_catalogue", "all_source_reconciliation_complete": False}), flush=True)
                  break
              if receipt.get("processed", 0) == 0:
                  raise RuntimeError("Eurostat batch made no progress while retained inputs remain")
          else:
              raise RuntimeError("Eurostat batch limit reached; continue from durable membership")
          PY
      - name: Archive exact Eurostat inputs proven by Bronze
        if: inputs.operation != 'inspect-retained'
        run: python scripts/archive-proven-eurostat-wdi-r2.py --source eurostat
      - name: Inspect remaining Eurostat coverage
        if: inputs.operation != 'inspect-retained'
        run: python scripts/inspect-eurostat-wdi-lineage-r2.py --source eurostat
      - name: Refresh portal index after accepted R2 writes
        if: success() && inputs.operation != 'inspect-retained'
        run: python scripts/publish-r2-portal-index.py

  promote:
    if: github.event_name == 'workflow_dispatch' && (inputs.operation == 'promote' || inputs.operation == '')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
      - name: Install R2 transformation dependencies
        run: python -m pip install "pyiceberg==0.12.0" "pyarrow==20.0.0" boto3 requests
      - name: Promote current R2 data through Silver and Gold
        env:
          R2_DATA_CATALOG_TOKEN: ${{ secrets.R2_DATA_CATALOG_TOKEN }}
          R2_CATALOG_URI: ${{ vars.R2_CATALOG_URI }}
          R2_WAREHOUSE: ${{ vars.R2_WAREHOUSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          R2_S3_ENDPOINT: ${{ vars.R2_S3_ENDPOINT }}
          R2_LAKEHOUSE_BUCKET: ${{ vars.R2_LAKEHOUSE_BUCKET }}
        run: python scripts/promote-current-r2.py
      - name: Keep pass-through promotions zero-copy
        env:
          R2_DATA_CATALOG_TOKEN: ${{ secrets.R2_DATA_CATALOG_TOKEN }}
          R2_CATALOG_URI: ${{ vars.R2_CATALOG_URI }}
          R2_WAREHOUSE: ${{ vars.R2_WAREHOUSE }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          R2_S3_ENDPOINT: ${{ vars.R2_S3_ENDPOINT }}
          R2_LAKEHOUSE_BUCKET: ${{ vars.R2_LAKEHOUSE_BUCKET }}
        run: python scripts/optimize-r2-promotions.py
