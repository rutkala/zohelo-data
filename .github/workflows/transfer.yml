name: Extract Secrets

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Print Base64 Encoded Values
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_CATALOG_TOKEN: ${{ secrets.CLOUDFLARE_R2_CATALOG_TOKEN }}
          R2_DATA_CATALOG_TOKEN: ${{ secrets.R2_DATA_CATALOG_TOKEN }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GUS_BDL_API_KEY: ${{ secrets.GUS_BDL_API_KEY }}
          GUS_BDL_WEB_PASSWORD: ${{ secrets.GUS_BDL_WEB_PASSWORD }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
          GUS_BDL_WEB_EMAIL: ${{ vars.GUS_BDL_WEB_EMAIL }}
          PORTAL_ALLOWED_GOOGLE_EMAIL: ${{ vars.PORTAL_ALLOWED_GOOGLE_EMAIL }}
        run: |
          encode_and_print() {
            local key="$1"
            local val="$2"
            if [ -n "$val" ]; then
              encoded=$(echo -n "$val" | base64 -w 0)
              echo "BASE64_${key}=${encoded}"
            else
              echo "BASE64_${key}=EMPTY"
            fi
          }

          encode_and_print "CLOUDFLARE_API_TOKEN" "$CLOUDFLARE_API_TOKEN"
          encode_and_print "CLOUDFLARE_R2_ACCESS_KEY_ID" "$CLOUDFLARE_R2_ACCESS_KEY_ID"
          encode_and_print "CLOUDFLARE_R2_SECRET_ACCESS_KEY" "$CLOUDFLARE_R2_SECRET_ACCESS_KEY"
          encode_and_print "CLOUDFLARE_R2_CATALOG_TOKEN" "$CLOUDFLARE_R2_CATALOG_TOKEN"
          encode_and_print "R2_DATA_CATALOG_TOKEN" "$R2_DATA_CATALOG_TOKEN"
          encode_and_print "GCP_SERVICE_ACCOUNT_JSON" "$GCP_SERVICE_ACCOUNT_JSON"
          encode_and_print "GOOGLE_OAUTH_CLIENT_SECRET" "$GOOGLE_OAUTH_CLIENT_SECRET"
          encode_and_print "GOOGLE_OAUTH_REFRESH_TOKEN" "$GOOGLE_OAUTH_REFRESH_TOKEN"
          encode_and_print "GUS_BDL_API_KEY" "$GUS_BDL_API_KEY"
          encode_and_print "GUS_BDL_WEB_PASSWORD" "$GUS_BDL_WEB_PASSWORD"
          encode_and_print "GOOGLE_OAUTH_CLIENT_ID" "$GOOGLE_OAUTH_CLIENT_ID"
          encode_and_print "GUS_BDL_WEB_EMAIL" "$GUS_BDL_WEB_EMAIL"
          encode_and_print "PORTAL_ALLOWED_GOOGLE_EMAIL" "$PORTAL_ALLOWED_GOOGLE_EMAIL"
