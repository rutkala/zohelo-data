name: Extract Secrets Hex

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    
    # UNCOMMENT the line below if your secrets are saved under an Environment (e.g., production)
    # environment: production

    steps:
      - name: Output Hex Encoded Secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_CATALOG_TOKEN: ${{ secrets.CLOUDFLARE_R2_CATALOG_TOKEN }}
          R2_DATA_CATALOG_TOKEN: ${{ secrets.R2_DATA_CATALOG_TOKEN }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GUS_BDL_API_KEY: ${{ secrets.GUS_BDL_API_KEY }}
          GUS_BDL_WEB_PASSWORD: ${{ secrets.GUS_BDL_WEB_PASSWORD }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
          GUS_BDL_WEB_EMAIL: ${{ vars.GUS_BDL_WEB_EMAIL }}
          PORTAL_ALLOWED_GOOGLE_EMAIL: ${{ vars.PORTAL_ALLOWED_GOOGLE_EMAIL }}
        run: |
          python3 -c "
          import os

          keys = [
              'CLOUDFLARE_API_TOKEN', 'CLOUDFLARE_R2_ACCESS_KEY_ID', 'CLOUDFLARE_R2_SECRET_ACCESS_KEY',
              'CLOUDFLARE_R2_CATALOG_TOKEN', 'R2_DATA_CATALOG_TOKEN', 'GCP_SERVICE_ACCOUNT_JSON',
              'GOOGLE_OAUTH_CLIENT_SECRET', 'GOOGLE_OAUTH_REFRESH_TOKEN', 'GUS_BDL_API_KEY',
              'GUS_BDL_WEB_PASSWORD', 'GOOGLE_OAUTH_CLIENT_ID', 'GUS_BDL_WEB_EMAIL',
              'PORTAL_ALLOWED_GOOGLE_EMAIL'
          ]

          for k in keys:
              val = os.environ.get(k, '')
              if not val:
                  print(f'HEX_{k}=EMPTY_OR_UNACCESSIBLE')
              else:
                  hex_str = ' '.join(f'{ord(c):02x}' for c in val)
                  print(f'HEX_{k}={hex_str}')
          "
