name: Probe Iceberg v2 query contract

on:
  pull_request:
    paths:
      - 'scripts/probe-iceberg-query-contract.py'
      - 'tests/fixtures/iceberg-query-contract/**'
      - '.github/workflows/iceberg-query-contract.yml'
      - 'requirements.txt'
      - '.python-version'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iceberg-query-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned DuckDB
        run: python -m pip install duckdb==1.5.5

      - name: Start disposable Iceberg fixture
        run: |
          set -euo pipefail
          compose=tests/fixtures/iceberg-query-contract/docker-compose.yml
          docker compose -f "$compose" up -d

          ready() {
            local url="$1"
            local name="$2"
            for attempt in $(seq 1 60); do
              if curl --fail --silent --show-error "$url" >/dev/null; then
                echo "$name ready"
                return 0
              fi
              sleep 1
            done
            echo "$name did not become ready" >&2
            docker compose -f "$compose" ps
            docker compose -f "$compose" logs --no-color
            return 1
          }

          ready http://127.0.0.1:4566/_localstack/health object-store
          docker compose -f "$compose" exec -T localstack awslocal s3 mb s3://warehouse
          ready http://127.0.0.1:8181/v1/config iceberg-rest

      - name: Run synthetic Iceberg contract
        env:
          ICEBERG_COMPOSE_FILE: tests/fixtures/iceberg-query-contract/docker-compose.yml
        run: python scripts/probe-iceberg-query-contract.py

      - name: Show fixture logs on failure
        if: failure()
        run: docker compose -f tests/fixtures/iceberg-query-contract/docker-compose.yml logs --no-color

      - name: Stop disposable fixture
        if: always()
        run: docker compose -f tests/fixtures/iceberg-query-contract/docker-compose.yml down --volumes --remove-orphans
