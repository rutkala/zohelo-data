name: GUS BDL controlled reset

on:
  push:
    branches: [main]
    paths:
      - 'src/bdl_reset.py'
      - '.github/workflows/reset-gus-bdl.yml'
      - 'ops/bdl-reset-trigger.txt'

permissions:
  contents: read

concurrency:
  group: zohelo-production-data
  cancel-in-progress: false
  queue: max

jobs:
  reset:
    if: contains(github.event.head_commit.message, '[reset-bdl]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Plan exact BDL reset
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: python src/bdl_reset.py plan --output bdl-reset-plan.json
      - name: Bind reviewed plan hash
        id: plan
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from hashlib import sha256
          from pathlib import Path
          print('sha256=' + sha256(Path('bdl-reset-plan.json').read_bytes()).hexdigest())
          PY
      - name: Apply and verify exact BDL reset
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: >-
          python src/bdl_reset.py apply
          --plan bdl-reset-plan.json
          --expected-plan-sha "${{ steps.plan.outputs.sha256 }}"
          --receipt bdl-reset-receipt.json
      - name: Upload reset evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bdl-reset-evidence
          path: |
            bdl-reset-plan.json
            bdl-reset-receipt.json
          if-no-files-found: warn
          retention-days: 14
