name: Migrate all zohelo-data files from Drive to R2

on:
  push:
    branches: [main]
    paths:
      - 'src/r2_migration.py'
      - 'scripts/migrate-drive-to-r2.py'
      - '.github/workflows/drive-to-r2-migration.yml'
  workflow_dispatch:
    inputs:
      expected_code_sha:
        description: 'Exact reviewed main SHA'
        required: true
        type: string
      confirm:
        description: 'Type copy-all-zohelo-data-preserve-drive'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: zohelo-drive-to-r2-migration
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  migrate:
    if: >-
      github.repository == 'rutkala/zohelo-data' && github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && contains(github.event.head_commit.message, '[run-all-r2-migration]')) ||
       (github.event_name == 'workflow_dispatch' && inputs.confirm == 'copy-all-zohelo-data-preserve-drive'))
    runs-on: ubuntu-latest
    timeout-minutes: 355
    concurrency:
      group: zohelo-production-data
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Require exact reviewed revision
        env:
          EXPECTED_CODE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_code_sha || github.sha }}
        run: |
          python - <<'PY'
          import os, re, subprocess
          expected = os.environ['EXPECTED_CODE_SHA']
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if not re.fullmatch(r'[0-9a-f]{40}', expected) or actual != expected:
              raise SystemExit('Reviewed main SHA mismatch')
          PY
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install boto3==1.43.103
      - name: Verify transfer safeguards without credentials
        run: python -m unittest discover -s tests -p test_r2_migration.py -v
      - name: Copy all retained layers; preserve Drive; produce candidate index only
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_S3_ENDPOINT: ${{ vars.R2_S3_ENDPOINT }}
          R2_LANDING_BUCKET: ${{ vars.R2_LANDING_BUCKET }}
          R2_LAKEHOUSE_BUCKET: ${{ vars.R2_LAKEHOUSE_BUCKET }}
        run: |
          python scripts/migrate-drive-to-r2.py \
            --confirm copy-all-zohelo-data-preserve-drive \
            --receipt "$RUNNER_TEMP/all-layer-r2-migration.json"
      - name: Retain aggregate receipt only; full inventory stays private in R2
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: all-layer-r2-migration-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/all-layer-r2-migration.json
          if-no-files-found: warn
          retention-days: 14
