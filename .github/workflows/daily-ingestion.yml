name: Data Ingestion Pipeline

on:
  schedule:
    # Daily production incremental run at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Target Source ID (Use "all" or specific ID like "nbp_exchange_rates_table_a")'
        required: true
        default: 'all'
        type: string
      mode:
        description: 'Ingestion Mode'
        required: true
        default: 'incremental'
        type: choice
        options:
          - incremental
          - full

jobs:
  ingest:
    name: Run Data Ingestion
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Ingestor
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          python src/ingestion/base_ingestor.py --source "${{ github.event.inputs.source || 'all' }}" --mode "${{ github.event.inputs.mode || 'incremental' }}"
