name: NBP data platform

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      operation:
        description: 'Publish data or promote a retained release'
        type: choice
        default: publish
        options: [publish, promote_retained_release]
      mode:
        description: 'Incremental, resumable history, or rebuild from retained raw'
        type: choice
        default: incremental
        options: [incremental, full, rebuild]
      target_release_id:
        description: 'Required for retained-release promotion'
        type: string
        default: ''
      expected_current_release_id:
        description: 'Current release safety pin, required for promotion'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: zohelo-production-data
  cancel-in-progress: false
  queue: max

jobs:
  run:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install platform dependencies
        run: python -m pip install -r requirements.txt
      - name: Run the selected NBP operation
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          OPERATION: ${{ inputs.operation || 'publish' }}
          NBP_MODE: ${{ inputs.mode || 'incremental' }}
          TARGET_RELEASE_ID: ${{ inputs.target_release_id }}
          EXPECTED_CURRENT_RELEASE_ID: ${{ inputs.expected_current_release_id }}
          DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
        run: |
          case "$OPERATION" in
            publish)
              python src/nbp_platform.py --mode "$NBP_MODE"
              ;;
            promote_retained_release)
              test -n "$TARGET_RELEASE_ID"
              test -n "$EXPECTED_CURRENT_RELEASE_ID"
              python scripts/promote_release.py \
                --target-release-id "$TARGET_RELEASE_ID" \
                --expected-current-release-id "$EXPECTED_CURRENT_RELEASE_ID"
              ;;
            *) echo 'Unknown operation' >&2; exit 1 ;;
          esac
