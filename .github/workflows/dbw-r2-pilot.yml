name: Pilot retained DBW on Cloudflare R2 Iceberg

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/publish-dbw-r2-pilot.py'
      - '.github/workflows/dbw-r2-pilot.yml'
  workflow_dispatch:
    inputs:
      expected_code_sha:
        description: 'Exact reviewed main SHA'
        required: true
        type: string
      confirm:
        description: 'Type copy-reviewed-dbw-to-r2-pilot'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: zohelo-r2-dbw-serving-copy-pilot
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'

jobs:
  dbw-r2-pilot:
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-dbw-r2-pilot]')) ||
        (github.event_name == 'workflow_dispatch' && inputs.confirm == 'copy-reviewed-dbw-to-r2-pilot')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Require reviewed main revision
        env:
          EXPECTED_CODE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_code_sha || github.sha }}
        run: |
          python - <<'PY'
          import os, re, subprocess
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          expected = os.environ['EXPECTED_CODE_SHA']
          if not re.fullmatch(r'[0-9a-f]{40}', expected) or expected != actual:
              raise SystemExit('Exact reviewed main SHA is required')
          PY

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Show bounded runner capacity
        run: df -h "$RUNNER_TEMP"

      - name: Restore and byte-verify exact reviewed DBW inventory from Drive
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          DRIVE_ROOT_ID: '1b9ucISOOUXQd6Ku-6qp6g373w9HJ2WOf'
        run: |
          python scripts/prepare_retained_dbw_release.py \
            --drive-root-id "$DRIVE_ROOT_ID" \
            --output "$RUNNER_TEMP/dbw-r2-input"

      - name: Build or resume retained DBW Iceberg serving-copy pilot
        env:
          CLOUDFLARE_R2_CATALOG_TOKEN: ${{ secrets.CLOUDFLARE_R2_CATALOG_TOKEN }}
          R2_CATALOG_URI: ${{ vars.R2_CATALOG_URI }}
          R2_WAREHOUSE: ${{ vars.R2_WAREHOUSE }}
        run: |
          python scripts/publish-dbw-r2-pilot.py \
            --restore "$RUNNER_TEMP/dbw-r2-input" \
            --receipt "$RUNNER_TEMP/dbw-r2-pilot-result.json"

      - name: Retain sanitized migration evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dbw-r2-pilot-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/dbw-r2-input/restore-evidence.json
            ${{ runner.temp }}/dbw-r2-input/fresh-audit-report.json
            ${{ runner.temp }}/dbw-r2-input/fresh-run-status.json
            ${{ runner.temp }}/dbw-r2-pilot-result.json
          if-no-files-found: ignore
          retention-days: 14
