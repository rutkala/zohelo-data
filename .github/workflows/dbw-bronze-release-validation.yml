name: Validate DBW Bronze release

on:
  pull_request:
    paths:
      - '.github/workflows/dbw-bronze-release*.yml'
      - 'scripts/prepare_retained_dbw_release.py'
      - 'src/retained_bronze_store.py'
      - 'tests/test_retained_bronze_direct_store.py'
      - 'scripts/verify_retained_dbw_release.py'
      - 'portal/scripts/verify-dbw-live.mjs'
      - 'tests/test_retained_dbw_release_actions.py'

permissions:
  contents: read

concurrency:
  group: validate-dbw-bronze-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Workflow safety and DBW release regressions
        run: |
          python scripts/check-workflows.py
          python -m unittest discover -s tests -p test_retained_dbw_release_actions.py -v
          python -m unittest discover -s tests -p test_retained_bronze_direct_store.py -v
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - run: node --check portal/scripts/verify-dbw-live.mjs
