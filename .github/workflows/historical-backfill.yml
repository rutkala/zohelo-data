name: Historical Backfill Pipeline

on:
  workflow_dispatch:
    inputs:
      source_id:
        description: 'Target source ID or all'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - nbp_exchange_rates_table_a
          - nbp_exchange_rates_table_b
          - nbp_exchange_rates_table_c
          - nbp_gold_prices
      mode:
        description: 'Ingestion Mode'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - incremental

jobs:
  backfill:
    name: Run Historical Backfill
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up shared Python version
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Execute Ingestor
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          SOURCE_ID: ${{ inputs.source_id }}
          INGESTION_MODE: ${{ inputs.mode }}
        run: |
          python src/ingestion/base_ingestor.py --source "$SOURCE_ID" --mode "$INGESTION_MODE"
