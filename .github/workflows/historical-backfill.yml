name: Historical Backfill Pipeline

on:
  workflow_dispatch:
    inputs:
      source_id:
        description: 'Target Source ID (Use "all" or specific ID like "nbp_api")'
        required: true
        default: 'all'
        type: string
      mode:
        description: 'Ingestion Mode'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - incremental

jobs:
  backfill:
    name: Run Historical Backfill
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Ingestor
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: |
          python src/ingestion/base_ingestor.py --source "${{ github.event.inputs.source_id }}" --mode "${{ github.event.inputs.mode }}"
