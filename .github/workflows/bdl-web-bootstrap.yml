name: BDL Web historical bootstrap

on:
  workflow_dispatch:
    inputs:
      reset_web_bulk:
        description: Clear old BDL Web-bulk Landing/checkpoints before starting
        type: boolean
        default: false
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - 'portal/scripts/bdl-web-bulk-worker.mjs'
      - 'src/bdl_web_bootstrap.py'
      - 'src/bdl_web_bulk_reset.py'
      - 'src/bdl_bulk_plan.py'
      - 'src/bdl_bulk_ingest.py'
      - '.github/workflows/bdl-web-bootstrap.yml'

permissions:
  contents: read

concurrency:
  group: zohelo-pipeline-gus_bdl
  cancel-in-progress: false

jobs:
  reset_web_bulk:
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && contains(github.event.head_commit.message, '[start-bdl-web-bootstrap]')) ||
       (github.event_name == 'workflow_dispatch' && inputs.reset_web_bulk))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Clear old BDL Web-bulk data and false checkpoints
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: python src/bdl_web_bulk_reset.py

  ingest_web_history:
    needs: [reset_web_bulk]
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main' &&
      (needs.reset_web_bulk.result == 'success' || needs.reset_web_bulk.result == 'skipped') &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && contains(github.event.head_commit.message, '[start-bdl-web-bootstrap]')))
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - name: Confirm Web and Drive credentials
        env:
          GUS_BDL_WEB_EMAIL: ${{ secrets.GUS_BDL_WEB_EMAIL }}
          GUS_BDL_WEB_PASSWORD: ${{ secrets.GUS_BDL_WEB_PASSWORD }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: |
          test -n "$GUS_BDL_WEB_EMAIL"
          test -n "$GUS_BDL_WEB_PASSWORD"
          test -n "$GOOGLE_OAUTH_CLIENT_ID"
          test -n "$GOOGLE_OAUTH_CLIENT_SECRET"
          test -n "$GOOGLE_OAUTH_REFRESH_TOKEN"
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements.txt
          npm --prefix portal ci --ignore-scripts --no-audit --no-fund
          cd portal
          npx --no-install playwright install --with-deps chromium
      - name: Ingest BDL historical data through authenticated Web UI
        env:
          GUS_BDL_WEB_EMAIL: ${{ secrets.GUS_BDL_WEB_EMAIL }}
          GUS_BDL_WEB_PASSWORD: ${{ secrets.GUS_BDL_WEB_PASSWORD }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          PYTHONPATH: src
        run: python src/bdl_web_bootstrap.py --workspace portal/test-results/bdl-web-bulk --max-seconds 18600
      - name: Upload sanitized ingestion evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bdl-web-historical-bootstrap-evidence
          path: |
            portal/test-results/bdl-web-bulk/plan.json
            portal/test-results/bdl-web-bulk/final-plan.json
            portal/test-results/bdl-web-bulk/worker-result.json
            portal/test-results/bdl-web-bulk/landing-summary.json
            portal/test-results/bdl-web-bulk/bootstrap-summary.json
          if-no-files-found: warn
          retention-days: 3
