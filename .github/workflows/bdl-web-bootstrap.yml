name: BDL Web historical bootstrap

on:
  workflow_dispatch:
    inputs:
      reset_web_bulk:
        description: 'Clear the BDL Web-bulk Landing namespace before starting'
        type: boolean
        default: false
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - 'portal/scripts/bdl-web-bulk-worker.mjs'
      - 'src/bdl_web_bulk_reset.py'
      - 'src/bdl_bulk_plan.py'
      - 'src/bdl_bulk_ingest.py'
      - '.github/workflows/bdl-web-bootstrap.yml'

permissions:
  contents: read

concurrency:
  group: zohelo-pipeline-gus_bdl
  cancel-in-progress: false

jobs:
  reset_web_bulk:
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && contains(github.event.head_commit.message, '[start-bdl-web-bootstrap]')) ||
       (github.event_name == 'workflow_dispatch' && inputs.reset_web_bulk))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Clear old BDL Web-bulk data and false markers
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: python src/bdl_web_bulk_reset.py

  ingest_web_history:
    needs: [reset_web_bulk]
    if: >-
      always() && !cancelled() &&
      github.ref == 'refs/heads/main' &&
      (needs.reset_web_bulk.result == 'success' || needs.reset_web_bulk.result == 'skipped') &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && contains(github.event.head_commit.message, '[start-bdl-web-bootstrap]')))
    runs-on: ubuntu-latest
    timeout-minutes: 330
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: '.python-version'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Confirm Web and Drive credentials
        env:
          GUS_BDL_WEB_EMAIL: ${{ secrets.GUS_BDL_WEB_EMAIL }}
          GUS_BDL_WEB_PASSWORD: ${{ secrets.GUS_BDL_WEB_PASSWORD }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: |
          test -n "$GUS_BDL_WEB_EMAIL"
          test -n "$GUS_BDL_WEB_PASSWORD"
          test -n "$GOOGLE_OAUTH_CLIENT_ID"
          test -n "$GOOGLE_OAUTH_CLIENT_SECRET"
          test -n "$GOOGLE_OAUTH_REFRESH_TOKEN"
      - name: Install pinned dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium
          python -m pip install -r ../requirements.txt
      - name: Ingest complete BDL history through Web UI
        env:
          GUS_BDL_WEB_EMAIL: ${{ secrets.GUS_BDL_WEB_EMAIL }}
          GUS_BDL_WEB_PASSWORD: ${{ secrets.GUS_BDL_WEB_PASSWORD }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          PYTHONPATH: ../src
        shell: bash
        run: |
          set -euo pipefail
          work=test-results/bdl-web-bulk
          mkdir -p "$work"
          started="$(date +%s)"
          # Leave time for the final verified Drive upload and Actions cleanup.
          deadline=$((started + 18600))
          completed_this_run=0
          while (( $(date +%s) < deadline )); do
            rm -f "$work/worker-result.json" "$work/landing-summary.json" "$work/candidate.env"
            find "$work" -maxdepth 1 -type f -name 'download-*.zip' -delete
            python ../src/bdl_bulk_plan.py plan --output "$work/plan.json"
            plan_status="$(python - <<'PY'
          import json
          print(json.load(open('test-results/bdl-web-bulk/plan.json', encoding='utf-8'))['status'])
          PY
            )"
            if [[ "$plan_status" == "complete" ]]; then
              echo "BDL Web historical bootstrap is complete."
              break
            fi
            if [[ "$plan_status" != "candidate" ]]; then
              echo "BDL Web bootstrap planner blocked with status: $plan_status" >&2
              cat "$work/plan.json" >&2
              exit 1
            fi
            python - <<'PY' > "$work/candidate.env"
          import json, shlex
          p=json.load(open('test-results/bdl-web-bulk/plan.json', encoding='utf-8'))
          c=p['candidate']
          values={
              'BDL_BULK_SUBGROUP_ID': c['subgroup_id'],
              'BDL_BULK_SUBGROUP_NAME': c.get('subgroup_name') or c['subgroup_id'],
              'BDL_BULK_URL': c['url'],
              'BDL_BULK_OUT_DIR': 'test-results/bdl-web-bulk',
              'SUBGROUP_ID': c['subgroup_id'],
          }
          for key,value in values.items():
              print(f"export {key}={shlex.quote(str(value))}")
          PY
            source "$work/candidate.env"
            echo "Starting Web historical extraction for $BDL_BULK_SUBGROUP_ID"
            node scripts/bdl-web-bulk-worker.mjs
            worker_status="$(python - <<'PY'
          import json
          print(json.load(open('test-results/bdl-web-bulk/worker-result.json', encoding='utf-8'))['status'])
          PY
            )"
            case "$worker_status" in
              downloaded_generated_export|downloaded_relational_export)
                archive="$(find "$work" -maxdepth 1 -type f -name 'download-*.zip' -print -quit)"
                test -n "$archive"
                python ../src/bdl_bulk_ingest.py \
                  --archive "$archive" \
                  --subgroup "$SUBGROUP_ID" \
                  --allow-production-write \
                  --summary "$work/landing-summary.json"
                ;;
              *)
                echo "BDL Web extraction did not land a complete subgroup: $worker_status" >&2
                cat "$work/worker-result.json" >&2
                exit 1
                ;;
            esac
            completed_this_run=$((completed_this_run + 1))
            echo "Completed $completed_this_run subgroup(s) in this run."
          done
          python ../src/bdl_bulk_plan.py plan --output "$work/final-plan.json"
          python - <<'PY'
          import json
          p=json.load(open('test-results/bdl-web-bulk/final-plan.json', encoding='utf-8'))
          print(json.dumps({
              'status': p['status'],
              'catalogue_subgroups': p['catalogue_subgroups'],
              'landed_subgroups': p['landed_subgroups'],
              'remaining_subgroups': p['remaining_subgroups'],
          }, sort_keys=True))
          PY
      - name: Upload sanitized bootstrap evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bdl-web-historical-bootstrap-evidence
          path: |
            portal/test-results/bdl-web-bulk/plan.json
            portal/test-results/bdl-web-bulk/final-plan.json
            portal/test-results/bdl-web-bulk/worker-result.json
            portal/test-results/bdl-web-bulk/landing-summary.json
          if-no-files-found: warn
          retention-days: 3
