name: BDL Web historical bootstrap

on:
  workflow_dispatch:
    inputs:
      reset_web_bulk:
        description: Clear BDL Web-bulk Landing/checkpoints before starting
        type: boolean
        default: false
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/bdl-web-bootstrap.yml'
      - 'src/bdl_web_queue.py'
      - 'portal/scripts/bdl-web-catalogue.mjs'
      - 'portal/scripts/bdl-web-bulk-worker.mjs'

permissions:
  contents: read
  actions: read

concurrency:
  group: zohelo-pipeline-gus_bdl
  cancel-in-progress: false

jobs:
  ingest_web_history:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'push' || contains(github.event.head_commit.message, '[resume-bdl-web]'))
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - name: Confirm Web and Drive credentials
        env:
          GUS_BDL_WEB_EMAIL: ${{ secrets.GUS_BDL_WEB_EMAIL }}
          GUS_BDL_WEB_PASSWORD: ${{ secrets.GUS_BDL_WEB_PASSWORD }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: |
          test -n "$GUS_BDL_WEB_EMAIL"
          test -n "$GUS_BDL_WEB_PASSWORD"
          test -n "$GOOGLE_OAUTH_CLIENT_ID"
          test -n "$GOOGLE_OAUTH_CLIENT_SECRET"
          test -n "$GOOGLE_OAUTH_REFRESH_TOKEN"
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements.txt
          npm --prefix portal ci --ignore-scripts --no-audit --no-fund
          cd portal
          npx --no-install playwright install --with-deps chromium
      - name: Optionally reset Web-bulk state
        if: github.event_name == 'workflow_dispatch' && inputs.reset_web_bulk
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: python src/bdl_web_bulk_reset.py
      - name: Recover inspected URL index when still available
        # Optional recovery metadata only. The Python loader checks the exact SHA-256.
        # After the artifact expires, the durable Web queue or fresh UI discovery is used.
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bdl-web-historical-bootstrap-evidence
          path: bdl-recovery-seed
          run-id: 34938114306
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Ingest BDL historical data through authenticated Web UI
        env:
          GUS_BDL_WEB_EMAIL: ${{ secrets.GUS_BDL_WEB_EMAIL }}
          GUS_BDL_WEB_PASSWORD: ${{ secrets.GUS_BDL_WEB_PASSWORD }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          PYTHONPATH: src
          PYTHONUNBUFFERED: '1'
        run: python src/bdl_web_queue.py --workspace portal/test-results/bdl-web-bulk --max-seconds 18600 --seed bdl-recovery-seed/plan.json
      - name: Upload sanitized ingestion evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bdl-web-historical-bootstrap-evidence
          path: |
            portal/test-results/bdl-web-bulk/catalogue-task.json
            portal/test-results/bdl-web-bulk/worker-result.json
            portal/test-results/bdl-web-bulk/bootstrap-summary.json
            portal/test-results/bdl-web-bulk/landed-*.json
            portal/test-results/bdl-web-bulk/failure-*.json
          if-no-files-found: warn
          retention-days: 3
