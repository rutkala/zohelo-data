name: BDL Web historical bootstrap

on:
  workflow_dispatch:
    inputs:
      auto_continue:
        description: Continue only after a verified bounded stop with resumable work
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

concurrency:
  group: zohelo-pipeline-gus_bdl
  cancel-in-progress: false
  queue: max

jobs:
  ingest_web_history:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
      actions: write
    steps:
      - name: Record absolute job start for bounded campaign budget
        run: echo "BDL_JOB_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - name: Install pinned browser and verified wireproxy module
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          npm --prefix portal ci --ignore-scripts --no-audit --no-fund
          (cd portal && npx --no-install playwright install --with-deps chromium)
          command -v go
          GOTOOLCHAIN=go1.26.0 GOSUMDB=sum.golang.org GONOSUMDB= GOPRIVATE= GOPROXY=https://proxy.golang.org go install github.com/windtf/wireproxy/cmd/wireproxy@v1.1.3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Restore optional inspected URL index
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bdl-web-historical-bootstrap-evidence
          path: bdl-recovery-seed
          run-id: 34938114306
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify routes then restore durable checkpoint and ingest native exports
        env:
          ZOHELO_WORKER1: ${{ secrets.ZOHELO_WORKER1 }}
          ZOHELO_WORKER2: ${{ secrets.ZOHELO_WORKER2 }}
          ZOHELO_WORKER3: ${{ secrets.ZOHELO_WORKER3 }}
          ZOHELO_WORKER4: ${{ secrets.ZOHELO_WORKER4 }}
          ZOHELO_WORKER5: ${{ secrets.ZOHELO_WORKER5 }}
          ZOHELO_WORKER6: ${{ secrets.ZOHELO_WORKER6 }}
          ZOHELO_WORKER7: ${{ secrets.ZOHELO_WORKER7 }}
          ZOHELO_WORKER8: ${{ secrets.ZOHELO_WORKER8 }}
          ZOHELO_WORKER9: ${{ secrets.ZOHELO_WORKER9 }}
          ZOHELO_WORKER10: ${{ secrets.ZOHELO_WORKER10 }}
          GUS_BDL_WEB_EMAIL: ${{ secrets.GUS_BDL_WEB_EMAIL }}
          GUS_BDL_WEB_PASSWORD: ${{ secrets.GUS_BDL_WEB_PASSWORD }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          PYTHONPATH: src
          PYTHONUNBUFFERED: '1'
        run: >-
          python scripts/multi_vpn_manager.py --
          python src/bdl_web_adaptive.py
          --workspace portal/test-results/bdl-web-bulk
          --mode resume
          --max-seconds @BDL_BUDGET@
          --seed bdl-recovery-seed/plan.json
          --concurrency 10
          --require-proxy-count 10
      - name: Upload sanitized ingestion evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bdl-web-historical-bootstrap-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            portal/test-results/bdl-web-bulk/catalogue-task.json
            portal/test-results/bdl-web-bulk/selection-task.json
            portal/test-results/bdl-web-bulk/selection-result.json
            portal/test-results/bdl-web-bulk/bootstrap-summary.json
            portal/test-results/bdl-web-bulk/landed-*.json
            portal/test-results/bdl-web-bulk/failure-*.json
          if-no-files-found: warn
          retention-days: 3
      - name: Decide safe continuation
        if: success() && inputs.auto_continue != false
        id: continuation
        run: python scripts/bdl_continuation.py portal/test-results/bdl-web-bulk/bootstrap-summary.json >> "$GITHUB_OUTPUT"
      - name: Queue successor after verified bounded stop
        if: success() && steps.continuation.outputs.CONTINUE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run bdl-web-bootstrap.yml --ref main -f auto_continue=true
