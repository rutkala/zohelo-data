name: BDL Web historical bootstrap

on:
  workflow_dispatch:
    inputs:
      reset_web_bulk:
        description: Clear BDL Web-bulk Landing/checkpoints before starting
        type: boolean
        default: false
  schedule:
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/bdl-web-bootstrap.yml'

permissions:
  contents: read

concurrency:
  group: zohelo-pipeline-gus_bdl
  cancel-in-progress: false

jobs:
  cleanup_obsolete_history:
    name: Remove obsolete Actions history
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, '[cleanup-actions-history]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Delete runs belonging to removed workflow files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import urllib.error
          import urllib.request

          repo = os.environ['REPOSITORY']
          token = os.environ['GH_TOKEN']
          active = {
              str(path).replace('\\', '/')
              for pattern in ('.github/workflows/*.yml', '.github/workflows/*.yaml')
              for path in pathlib.Path('.').glob(pattern)
          }
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'zohelo-actions-cleanup',
          }

          def request(method, url):
              req = urllib.request.Request(url, method=method, headers=headers)
              with urllib.request.urlopen(req, timeout=60) as response:
                  raw = response.read()
                  return json.loads(raw) if raw else None

          obsolete = []
          page = 1
          while True:
              payload = request('GET', f'https://api.github.com/repos/{repo}/actions/runs?per_page=100&page={page}')
              runs = payload.get('workflow_runs', [])
              if not runs:
                  break
              for run in runs:
                  path = run.get('path')
                  if path and path not in active and run.get('status') == 'completed':
                      obsolete.append((run['id'], run.get('name'), path))
              if len(runs) < 100:
                  break
              page += 1

          print(f'Active workflow files: {sorted(active)}')
          print(f'Obsolete completed runs found: {len(obsolete)}')
          deleted = 0
          failures = []
          for run_id, name, path in obsolete:
              try:
                  request('DELETE', f'https://api.github.com/repos/{repo}/actions/runs/{run_id}')
                  deleted += 1
                  print(f'Deleted {run_id}: {name} ({path})')
              except urllib.error.HTTPError as exc:
                  failures.append((run_id, exc.code, name, path))
                  print(f'FAILED {run_id}: HTTP {exc.code} {name} ({path})')

          print(f'Deleted obsolete runs: {deleted}')
          if failures:
              raise SystemExit(f'Failed to delete {len(failures)} obsolete runs: {failures[:10]}')
          PY

  ingest_web_history:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - name: Confirm Web and Drive credentials
        env:
          GUS_BDL_WEB_EMAIL: ${{ secrets.GUS_BDL_WEB_EMAIL }}
          GUS_BDL_WEB_PASSWORD: ${{ secrets.GUS_BDL_WEB_PASSWORD }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: |
          test -n "$GUS_BDL_WEB_EMAIL"
          test -n "$GUS_BDL_WEB_PASSWORD"
          test -n "$GOOGLE_OAUTH_CLIENT_ID"
          test -n "$GOOGLE_OAUTH_CLIENT_SECRET"
          test -n "$GOOGLE_OAUTH_REFRESH_TOKEN"
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements.txt
          npm --prefix portal ci --ignore-scripts --no-audit --no-fund
          cd portal
          npx --no-install playwright install --with-deps chromium
      - name: Optionally reset Web-bulk state
        if: github.event_name == 'workflow_dispatch' && inputs.reset_web_bulk
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: python src/bdl_web_bulk_reset.py
      - name: Ingest BDL historical data through authenticated Web UI
        env:
          GUS_BDL_WEB_EMAIL: ${{ secrets.GUS_BDL_WEB_EMAIL }}
          GUS_BDL_WEB_PASSWORD: ${{ secrets.GUS_BDL_WEB_PASSWORD }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          PYTHONPATH: src
        run: python src/bdl_web_bootstrap.py --workspace portal/test-results/bdl-web-bulk --max-seconds 18600
      - name: Upload sanitized ingestion evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bdl-web-historical-bootstrap-evidence
          path: |
            portal/test-results/bdl-web-bulk/plan.json
            portal/test-results/bdl-web-bulk/final-plan.json
            portal/test-results/bdl-web-bulk/worker-result.json
            portal/test-results/bdl-web-bulk/landing-summary.json
            portal/test-results/bdl-web-bulk/bootstrap-summary.json
          if-no-files-found: warn
          retention-days: 3
