name: Direct-copy reviewed DBW Parquet to R2 Iceberg

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/copy-dbw-r2-direct.py'
      - '.github/workflows/dbw-r2-direct-copy.yml'
  workflow_dispatch:
    inputs:
      expected_code_sha:
        description: 'Exact reviewed main SHA'
        required: true
        type: string
      confirm:
        description: 'Type copy-reviewed-dbw-direct-to-r2'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: zohelo-r2-dbw-direct-copy
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'

jobs:
  direct-copy:
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-dbw-r2-direct]')) ||
        (github.event_name == 'workflow_dispatch' && inputs.confirm == 'copy-reviewed-dbw-direct-to-r2')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Require reviewed main revision
        env:
          EXPECTED_CODE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_code_sha || github.sha }}
        run: |
          python - <<'PY'
          import os, re, subprocess
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          expected = os.environ['EXPECTED_CODE_SHA']
          if not re.fullmatch(r'[0-9a-f]{40}', expected) or expected != actual:
              raise SystemExit('Exact reviewed main SHA is required')
          PY

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install repository dependencies
        run: python -m pip install -r requirements.txt

      - name: Install pinned direct-copy dependencies
        run: |
          python -m pip install             boto3==1.43.103             pyiceberg==0.12.0             pyarrow==25.0.1

      - name: Direct-copy reviewed DBW Parquet and register existing files in Iceberg
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_CATALOG_TOKEN: ${{ secrets.CLOUDFLARE_R2_CATALOG_TOKEN }}
          R2_S3_ENDPOINT: ${{ vars.R2_S3_ENDPOINT }}
          R2_LAKEHOUSE_BUCKET: ${{ vars.R2_LAKEHOUSE_BUCKET }}
          R2_CATALOG_URI: ${{ vars.R2_CATALOG_URI }}
          R2_WAREHOUSE: ${{ vars.R2_WAREHOUSE }}
          DRIVE_ROOT_ID: '1b9ucISOOUXQd6Ku-6qp6g373w9HJ2WOf'
        run: |
          mkdir -p "$RUNNER_TEMP/dbw-r2-direct-work"
          python scripts/copy-dbw-r2-direct.py             --drive-root-id "$DRIVE_ROOT_ID"             --work-dir "$RUNNER_TEMP/dbw-r2-direct-work"             --receipt "$RUNNER_TEMP/dbw-r2-direct-result.json"

      - name: Retain sanitized direct-copy evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dbw-r2-direct-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dbw-r2-direct-result.json
          if-no-files-found: error
          retention-days: 14
