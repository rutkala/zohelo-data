name: BDL Web UI export probe 2

on:
  push:
    branches: [main]
    paths: ['.github/workflows/bdl-web-probe-export2.yml']

permissions:
  contents: read

concurrency:
  group: zohelo-pipeline-gus_bdl
  cancel-in-progress: false

jobs:
  probe:
    if: contains(github.event.head_commit.message, '[probe-bdl-export2]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium
      - name: Follow current Web UI to relational export
        env:
          GUS_BDL_WEB_EMAIL: ${{ secrets.GUS_BDL_WEB_EMAIL }}
          GUS_BDL_WEB_PASSWORD: ${{ secrets.GUS_BDL_WEB_PASSWORD }}
        run: |
          mkdir -p test-results/bdl-export-probe
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          import path from 'node:path';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({acceptDownloads:true,locale:'pl-PL'});
          const page=await context.newPage();
          try {
            await page.goto('https://bdl.stat.gov.pl/bdl/logowanie',{waitUntil:'domcontentloaded',timeout:45000});
            await page.locator('#ctl00_ContentPlaceHolder_Email').fill(process.env.GUS_BDL_WEB_EMAIL);
            await page.locator('#ctl00_ContentPlaceHolder_Password').fill(process.env.GUS_BDL_WEB_PASSWORD);
            await page.locator('#ctl00_ContentPlaceHolder_SignIn').click();
            await page.waitForTimeout(1000);
            await page.goto('https://bdl.stat.gov.pl/bdl/dane/podgrup/wymiary/2/3/1319',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(900);
            const seen=new Set();
            for(let round=0;round<20;round++){
              const ids=await page.locator('[id$="_SelectAll"]').evaluateAll(els=>els.map(e=>({id:e.id,visible:!!(e.offsetWidth||e.offsetHeight||e.getClientRects().length),disabled:!!e.disabled})));
              const item=ids.filter(x=>x.visible&&!x.disabled&&!seen.has(x.id)).sort((a,b)=>a.id.localeCompare(b.id))[0];
              if(!item) break;
              await page.locator(`#${item.id}`).click(); seen.add(item.id); await page.waitForTimeout(600);
            }
            await page.locator('#ctl00_ContentPlaceHolder_dalej1').click();
            await page.waitForTimeout(1000);
            await page.locator('#ctl00_ContentPlaceHolder_terytList_MenuButton').click();
            await page.locator('li.rmItem').filter({hasText:'Zaznacz wszystkie'}).first().locator('.rmLink').click();
            const transferAll=page.locator('a.rlbTransferAllFrom').first();
            if(!await transferAll.isVisible()) throw new Error('Transfer-all-to-selected control not visible');
            await transferAll.click();
            const next=page.locator('#ctl00_ContentPlaceHolder_dalej1');
            for(let i=0;i<30 && !(await next.isEnabled());i++) await page.waitForTimeout(400);
            const body=await page.locator('body').innerText();
            console.log('EXPORT2_SELECTED_TERRITORIES='+(body.match(/Wybranych elementów:\s*([0-9\s]+)/i)?.[1]?.replace(/\s/g,'')||'unknown'));
            if(!await next.isEnabled()) throw new Error('Dalej not enabled after transfer all');
            await next.click();
            await page.waitForTimeout(1800);
            console.log('EXPORT2_TABLE_URL='+page.url());
            console.log('EXPORT2_TABLE_CONTROLS='+JSON.stringify(await page.locator('button,a,input').evaluateAll(els=>els.filter(e=>!!(e.offsetWidth||e.offsetHeight||e.getClientRects().length)).map(e=>({id:e.id||null,cls:typeof e.className==='string'?e.className:'',value:e.getAttribute('value'),text:(e.textContent||'').trim().replace(/\s+/g,' ').slice(0,160),href:e.getAttribute('href')})).filter(x=>/export|eksport|csv|xls/i.test(`${x.id} ${x.cls} ${x.value} ${x.text} ${x.href}`))))));
            const exportButton=page.getByText(/Eksport|Export/i,{exact:true}).first();
            if(await exportButton.count()) { await exportButton.click(); await page.waitForTimeout(500); }
            const choices=await page.locator('a,li,span').evaluateAll(els=>els.filter(e=>!!(e.offsetWidth||e.offsetHeight||e.getClientRects().length)).map(e=>(e.textContent||'').trim().replace(/\s+/g,' ')).filter(t=>/CSV|XLS/i.test(t)));
            console.log('EXPORT2_CHOICES='+JSON.stringify([...new Set(choices)]));
            const csv=page.getByText(/CSV[^\n]*relacyj/i).first();
            if(!(await csv.count()) || !(await csv.isVisible())) throw new Error('Relational CSV export option not visible');
            const [download]=await Promise.all([page.waitForEvent('download',{timeout:60000}),csv.click()]);
            const target=path.resolve('test-results/bdl-export-probe/probe.zip');
            await download.saveAs(target);
            console.log('EXPORT2_FILENAME='+download.suggestedFilename());
          } finally { await browser.close(); }
          NODE
      - name: Inspect archive schema
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv, io, zipfile
          p=Path('test-results/bdl-export-probe/probe.zip')
          print('EXPORT2_ARCHIVE_SIZE='+str(p.stat().st_size))
          with zipfile.ZipFile(p) as z:
              names=[n for n in z.namelist() if not n.endswith('/')]
              print('EXPORT2_MEMBERS='+repr(names))
              csvs=[n for n in names if n.lower().endswith('.csv')]
              print('EXPORT2_CSV_COUNT='+str(len(csvs)))
              if len(csvs)!=1: raise SystemExit(2)
              raw=z.read(csvs[0])
          for enc in ('utf-8-sig','cp1250','iso-8859-2'):
              try: text=raw.decode(enc); print('EXPORT2_ENCODING='+enc); break
              except UnicodeDecodeError: continue
          else: raise SystemExit(3)
          sample=text[:200000]
          try: delim=csv.Sniffer().sniff(sample[:20000],delimiters=';,\t|').delimiter
          except csv.Error: delim=';'
          rows=csv.reader(io.StringIO(sample),delimiter=delim)
          header=next(rows,[]); first=next(rows,[])
          print('EXPORT2_DELIMITER='+repr(delim))
          print('EXPORT2_HEADER='+repr(header))
          print('EXPORT2_FIRST_ROW='+repr(first))
          PY
