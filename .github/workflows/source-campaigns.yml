name: Source ingestion campaigns

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Run all admitted sources or one source campaign'
        type: choice
        default: all
        options: [all, world_bank_wdi, gus_bdl, eurostat]
      pause_history:
        description: 'Collect recent data and metadata while leaving historical tasks checkpointed'
        type: boolean
        default: false
      retry_validation:
        description: 'Retry HTTP-200 parser rejections from older code; preserve provider backoff and quotas'
        type: boolean
        default: false
      cycles:
        description: 'Consecutive collect-and-publish batches, within the 15-minute session budget'
        type: choice
        default: '3'
        options: ['1', '3', '6']
      publish_only:
        description: 'Publish already-collected accepted responses without calling source APIs'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'src/source_campaign.py'
      - 'src/ingestion/**'
      - 'src/ingestion/sources/**'
      - 'config/source-campaigns.yaml'
      - 'config/source-access.yaml'
      - '.github/workflows/source-campaigns.yml'

permissions:
  contents: read

jobs:
  prepare:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'push' || contains(github.event.head_commit.message, '[run-source-campaigns]'))
    concurrency:
      group: zohelo-source-campaign-prepare
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify headroom and prepare independent source paths
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          CAMPAIGN_CYCLES: ${{ inputs.cycles || '3' }}
        run: python src/source_campaign.py --initialize-drive --allow-production-write --cycles "$CAMPAIGN_CYCLES"
  collect:
    needs: prepare
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'push' || contains(github.event.head_commit.message, '[run-source-campaigns]'))
    strategy:
      fail-fast: false
      matrix:
        source: [world_bank_wdi, gus_bdl, eurostat]
    concurrency:
      group: zohelo-source-campaign-${{ matrix.source }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Collect and publish consecutive Landing batches
        if: github.event_name != 'workflow_dispatch' || inputs.source == 'all' || inputs.source == matrix.source
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GUS_BDL_API_KEY: ${{ matrix.source == 'gus_bdl' && secrets.GUS_BDL_API_KEY || '' }}
          CAMPAIGN_SOURCE: ${{ matrix.source }}
          CAMPAIGN_CYCLES: ${{ inputs.cycles || '3' }}
          CAMPAIGN_PUBLISH_ONLY: ${{ inputs.publish_only || 'false' }}
          CAMPAIGN_PAUSE_HISTORY: ${{ inputs.pause_history || 'false' }}
          CAMPAIGN_RETRY_VALIDATION: ${{ inputs.retry_validation || contains(github.event.head_commit.message, '[retry-source-validation]') || 'false' }}
        run: |
          args=(--source "$CAMPAIGN_SOURCE" --backend drive --allow-production-write --summary campaign-summary.json --cycles "$CAMPAIGN_CYCLES")
          if [[ "$CAMPAIGN_PAUSE_HISTORY" == "true" ]]; then
            args+=(--pause-history)
          fi
          if [[ "$CAMPAIGN_PUBLISH_ONLY" == "true" ]]; then
            args+=(--publish-only)
          elif [[ "$CAMPAIGN_RETRY_VALIDATION" == "true" ]]; then
            args+=(--retry-validation-failures)
          fi
          python src/source_campaign.py "${args[@]}"
      - name: Restore accepted evidence in a fresh process
        if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.source == 'all' || inputs.source == matrix.source) }}
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          CAMPAIGN_SOURCE: ${{ matrix.source }}
        run: python src/source_campaign.py --source "$CAMPAIGN_SOURCE" --backend drive --allow-production-write --verify-current
      - name: Restore and query published Landing in a fresh process
        if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.source == 'all' || inputs.source == matrix.source) }}
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          CAMPAIGN_SOURCE: ${{ matrix.source }}
        run: python src/source_campaign.py --source "$CAMPAIGN_SOURCE" --backend drive --allow-production-write --verify-landing
