name: Source ingestion campaigns

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Run all admitted sources or one source campaign'
        type: choice
        default: all
        options: [all, world_bank_wdi, gus_bdl, eurostat]
      pause_history:
        description: 'Collect recent data and metadata while leaving historical tasks checkpointed'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'src/source_campaign.py'
      - 'src/ingestion/source_campaign*.py'
      - 'src/ingestion/sources/**'
      - 'config/source-campaigns.yaml'
      - '.github/workflows/source-campaigns.yml'

permissions:
  contents: read

jobs:
  prepare:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'push' || contains(github.event.head_commit.message, '[run-source-campaigns]'))
    concurrency:
      group: zohelo-source-campaign-prepare
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify headroom and prepare independent source paths
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: python src/source_campaign.py --initialize-drive --allow-production-write
  collect:
    needs: prepare
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'push' || contains(github.event.head_commit.message, '[run-source-campaigns]'))
    strategy:
      fail-fast: false
      matrix:
        source: [world_bank_wdi, gus_bdl, eurostat]
    concurrency:
      group: zohelo-source-campaign-${{ matrix.source }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Collect bounded source responses and verify durable checkpoints
        if: github.event_name != 'workflow_dispatch' || inputs.source == 'all' || inputs.source == matrix.source
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          CAMPAIGN_SOURCE: ${{ matrix.source }}
          CAMPAIGN_PAUSE_HISTORY: ${{ inputs.pause_history || 'false' }}
        run: |
          args=(--source "$CAMPAIGN_SOURCE" --backend drive --allow-production-write --summary campaign-summary.json)
          if [[ "$CAMPAIGN_PAUSE_HISTORY" == "true" ]]; then
            args+=(--pause-history)
          fi
          python src/source_campaign.py "${args[@]}"
      - name: Restore accepted evidence in a fresh process
        if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.source == 'all' || inputs.source == matrix.source) }}
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          CAMPAIGN_SOURCE: ${{ matrix.source }}
        run: python src/source_campaign.py --source "$CAMPAIGN_SOURCE" --backend drive --allow-production-write --verify-current
