name: Check Google Drive upload

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/check_google_upload.py'
      - '.github/workflows/google-upload-check.yml'

permissions:
  contents: read

concurrency:
  group: google-upload-check
  cancel-in-progress: false

jobs:
  check:
    # Live writes require an intentional manual run or a reviewed opt-in merge.
    # Ordinary source/workflow edits do not authorize an upload test.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       contains(github.event.head_commit.message, '[verify-drive-upload]'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Upload one temporary file, verify its bytes, and remove it
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: python scripts/check_google_upload.py --allow-write-test
