version: 2

models:
  - name: br_eurostat_observations
    description: "Bronze cells decoded from accepted Eurostat JSON-stat envelopes, retaining complete native dimensional keys and response provenance."
    columns:
      - name: dataset_id
      - name: dimension_key_sha256
      - name: period_key
  - name: eurostat_observation_revisions
    description: "Distinct typed Eurostat cell representations across exact replays and revisions."
    columns:
      - name: dataset_id
      - name: dimension_key_sha256
  - name: stg_eurostat_observations
    description: "Latest retained Eurostat representation at dataset and complete native dimensional-key grain."
    columns:
      - name: dataset_id
      - name: dimension_key_sha256
  - name: dim_eurostat_dataset
    description: "Gold dimension for modeled Eurostat datasets in the admitted API contract."
    columns:
      - name: dataset_key
  - name: dim_eurostat_geography
    description: "Gold dimension for modeled Eurostat EU-country geographies."
    columns:
      - name: geography_key
  - name: dim_eurostat_period
    description: "Gold period dimension preserving Eurostat annual and monthly keys."
    columns:
      - name: period_key
  - name: fact_eurostat_observations
    description: "Gold Eurostat cells at dataset and complete native dimensional-key grain, including explicit missing cells and status flags."
    columns:
      - name: dataset_key
      - name: geography_key
      - name: dimension_key_sha256
  - name: mart_eurostat_coverage
    description: "One-row accountability snapshot for the explicitly partial Eurostat API model; raw_catalogue_complete tracks raw retention while complete_official_catalogue stays false until full-distribution modeling is accepted."
    columns:
      - name: snapshot_date
      - name: admitted_dataset_total
      - name: admitted_series_total
      - name: latest_observation_date
      - name: raw_catalogue_complete
      - name: complete_official_catalogue
      - name: catalogue_distributions
      - name: validated_current_distributions
