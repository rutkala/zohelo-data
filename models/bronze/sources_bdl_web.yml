version: 2

sources:
  - name: bronze_bdl_web
    schema: 02_bronze
    description: "GUS BDL Web Bulk Bronze Parquet observations generated by bdl_bronze_loader."
    config:
      enabled: "{{ var('enable_gus_bdl_web', false) }}"
    tables:
      - name: observations
        description: "GUS BDL Bronze observations partitioned by subgroup and selection."
        meta:
          formatter: template
          external_location: "read_parquet('{{ env_var('ZOHELO_DATA_ROOT', '/tmp/zohelo_data') }}/02_bronze/gus_bdl/observations/*.parquet', union_by_name = true)"
