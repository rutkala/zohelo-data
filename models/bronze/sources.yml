version: 2

sources:
  - name: bronze
    schema: 02_bronze
    description: "Legacy NBP Parquet inputs in the 02_bronze storage layer. This source remains available for the historical Silver-only compatibility build."
    config:
      enabled: "{{ not var('nbp_verified_batches', false) }}"
    tables:
      - name: nbp_exchange_rates_table_a
        description: "Legacy NBP exchange rates table A Parquet batches."
        meta:
          formatter: template
          external_location: "read_parquet('{{ env_var('ZOHELO_DATA_ROOT', '/tmp/zohelo_data') }}/02_bronze/nbp_exchange_rates_table_a/*.parquet', union_by_name = true, filename = true)"
      - name: nbp_exchange_rates_table_b
        description: "Legacy NBP exchange rates table B Parquet batches."
        meta:
          formatter: template
          external_location: "read_parquet('{{ env_var('ZOHELO_DATA_ROOT', '/tmp/zohelo_data') }}/02_bronze/nbp_exchange_rates_table_b/*.parquet', union_by_name = true, filename = true)"
      - name: nbp_exchange_rates_table_c
        description: "Legacy NBP exchange rates table C Parquet batches."
        meta:
          formatter: template
          external_location: "read_parquet('{{ env_var('ZOHELO_DATA_ROOT', '/tmp/zohelo_data') }}/02_bronze/nbp_exchange_rates_table_c/*.parquet', union_by_name = true, filename = true)"
      - name: nbp_gold_prices
        description: "Legacy NBP gold-price Parquet batches using the API data and cena fields."
        meta:
          formatter: template
          external_location: "read_parquet('{{ env_var('ZOHELO_DATA_ROOT', '/tmp/zohelo_data') }}/02_bronze/nbp_gold_prices/*.parquet', union_by_name = true, filename = true)"

  - name: bronze_opendata
    schema: 02_bronze
    description: "OpenData.org global entity directory Parquet tables in the 02_bronze storage layer."
    config:
      enabled: "{{ var('enable_opendata', false) }}"
    tables:
      - name: organizations
        description: "Bronze OpenData organizations streamed directly from Senzing JSONL bulk archives."
        meta:
          formatter: template
          external_location: "read_parquet('{{ env_var('ZOHELO_DATA_ROOT', '/tmp/zohelo_data') }}/02_bronze/opendata_org/organizations/*.parquet', union_by_name = true, filename = true)"
      - name: locations
        description: "Bronze OpenData locations streamed directly from Senzing JSONL bulk archives."
        meta:
          formatter: template
          external_location: "read_parquet('{{ env_var('ZOHELO_DATA_ROOT', '/tmp/zohelo_data') }}/02_bronze/opendata_org/locations/*.parquet', union_by_name = true, filename = true)"
      - name: people
        description: "Bronze OpenData people and business executives streamed directly from Senzing JSONL bulk archives."
        meta:
          formatter: template
          external_location: "read_parquet('{{ env_var('ZOHELO_DATA_ROOT', '/tmp/zohelo_data') }}/02_bronze/opendata_org/people/*.parquet', union_by_name = true, filename = true)"

  - name: bronze_dbw
    schema: 02_bronze
    description: "GUS DBW (Dziedzinowe Bazy Wiedzy) Bronze Parquet tables."
    config:
      enabled: "{{ var('enable_gus_dbw', false) }}"
    tables:
      - name: observations
        description: "GUS DBW Bronze observations partitioned by indicator."
        meta:
          formatter: template
          external_location: "read_parquet('{{ env_var('ZOHELO_DATA_ROOT', '/tmp/zohelo_data') }}/02_bronze/gus_dbw/releases/{{ env_var('ZOHELO_DBW_BRONZE_RELEASE_ID', '__DBW_RELEASE_NOT_SELECTED__') }}/observations/part_*.parquet', union_by_name = true)"
      - name: indicators
        description: "GUS DBW Bronze indicators taxonomy mapped to areas and domains."
        meta:
          formatter: template
          external_location: "read_parquet('{{ env_var('ZOHELO_DATA_ROOT', '/tmp/zohelo_data') }}/02_bronze/gus_dbw/releases/{{ env_var('ZOHELO_DBW_BRONZE_RELEASE_ID', '__DBW_RELEASE_NOT_SELECTED__') }}/taxonomy/br_dbw_indicators.parquet', union_by_name = true)"
      - name: metadata
        description: "GUS DBW Bronze methodological metryka for indicators."
        meta:
          formatter: template
          external_location: "read_parquet('{{ env_var('ZOHELO_DATA_ROOT', '/tmp/zohelo_data') }}/02_bronze/gus_dbw/releases/{{ env_var('ZOHELO_DBW_BRONZE_RELEASE_ID', '__DBW_RELEASE_NOT_SELECTED__') }}/metadata/br_dbw_metadata.parquet', union_by_name = true)"
      - name: dictionaries
        description: "GUS DBW Bronze dimension and element dictionaries."
        meta:
          formatter: template
          external_location: "read_parquet('{{ env_var('ZOHELO_DATA_ROOT', '/tmp/zohelo_data') }}/02_bronze/gus_dbw/releases/{{ env_var('ZOHELO_DBW_BRONZE_RELEASE_ID', '__DBW_RELEASE_NOT_SELECTED__') }}/dictionaries/br_dbw_dictionaries.parquet', union_by_name = true)"

  - name: bronze_teryt
    schema: 02_bronze
    description: "GUS TERYT (Krajowy Rejestr Urzędowy Podziału Terytorialnego Kraju) Bronze Parquet tables."
    config:
      enabled: "{{ var('enable_gus_teryt', false) }}"
    tables:
      - name: terc
        description: "Official administrative division hierarchy (voivodeships, powiats, gminas)."
        meta:
          formatter: template
          external_location: "read_parquet('{{ env_var('ZOHELO_DATA_ROOT', '/tmp/zohelo_data') }}/02_bronze/gus_teryt/br_teryt_terc.parquet')"
      - name: simc
        description: "Official localities register (towns, villages, parts of localities)."
        meta:
          formatter: template
          external_location: "read_parquet('{{ env_var('ZOHELO_DATA_ROOT', '/tmp/zohelo_data') }}/02_bronze/gus_teryt/br_teryt_simc.parquet')"
      - name: ulic
        description: "Official streets register."
        meta:
          formatter: template
          external_location: "read_parquet('{{ env_var('ZOHELO_DATA_ROOT', '/tmp/zohelo_data') }}/02_bronze/gus_teryt/br_teryt_ulic.parquet')"

  - name: bronze_prg
    schema: 02_bronze
    description: "GUGiK PRG (Państwowy Rejestr Granic) Bronze Parquet tables with official GIS boundaries."
    config:
      enabled: "{{ var('enable_gugik_prg', false) }}"
    tables:
      - name: country
        description: "National boundary of Poland (Polska)."
        meta:
          formatter: template
          external_location: "read_parquet('{{ env_var('ZOHELO_DATA_ROOT', '/tmp/zohelo_data') }}/02_bronze/gugik_prg/br_prg_country.parquet')"
      - name: voivodeships
        description: "Voivodeship boundaries."
        meta:
          formatter: template
          external_location: "read_parquet('{{ env_var('ZOHELO_DATA_ROOT', '/tmp/zohelo_data') }}/02_bronze/gugik_prg/br_prg_voivodeships.parquet')"
      - name: counties
        description: "County (powiat) boundaries."
        meta:
          formatter: template
          external_location: "read_parquet('{{ env_var('ZOHELO_DATA_ROOT', '/tmp/zohelo_data') }}/02_bronze/gugik_prg/br_prg_counties.parquet')"
      - name: municipalities
        description: "Municipality (gmina) boundaries."
        meta:
          formatter: template
          external_location: "read_parquet('{{ env_var('ZOHELO_DATA_ROOT', '/tmp/zohelo_data') }}/02_bronze/gugik_prg/br_prg_municipalities.parquet')"

  - name: bronze_mf_biala_lista
    schema: 02_bronze
    description: "Ministerstwo Finansów Biała Lista Podatników VAT Bronze Parquet tables."
    config:
      enabled: "{{ var('enable_mf_biala_lista', false) }}"
    tables:
      - name: header
        description: "Official Biała Lista generation metadata and transformation parameters."
        meta:
          formatter: template
          external_location: "read_parquet('{{ env_var('ZOHELO_DATA_ROOT', '/tmp/zohelo_data') }}/02_bronze/mf_biala_lista/br_biala_lista_header.parquet')"
      - name: masks
        description: "Virtual bank account masks for subaccount validation."
        meta:
          formatter: template
          external_location: "read_parquet('{{ env_var('ZOHELO_DATA_ROOT', '/tmp/zohelo_data') }}/02_bronze/mf_biala_lista/br_biala_lista_masks.parquet')"
      - name: taxpayers
        description: "Active and exempt VAT taxpayer and bank account SHA-512 hashes."
        meta:
          formatter: template
          external_location: "read_parquet('{{ env_var('ZOHELO_DATA_ROOT', '/tmp/zohelo_data') }}/02_bronze/mf_biala_lista/br_biala_lista_taxpayers.parquet')"

  - name: bronze_biala_lista
    schema: 02_bronze
    description: "Ministerstwo Finansów Biała Lista Podatników VAT Bronze Parquet tables (alias)."
    config:
      enabled: "{{ var('enable_mf_biala_lista', false) }}"
    tables:
      - name: header
        description: "Official Biała Lista generation metadata and transformation parameters."
        meta:
          formatter: template
          external_location: "read_parquet('{{ env_var('ZOHELO_DATA_ROOT', '/tmp/zohelo_data') }}/02_bronze/mf_biala_lista/br_biala_lista_header.parquet')"
      - name: masks
        description: "Virtual bank account masks for subaccount validation."
        meta:
          formatter: template
          external_location: "read_parquet('{{ env_var('ZOHELO_DATA_ROOT', '/tmp/zohelo_data') }}/02_bronze/mf_biala_lista/br_biala_lista_masks.parquet')"
      - name: taxpayers
        description: "Active and exempt VAT taxpayer and bank account SHA-512 hashes."
        meta:
          formatter: template
          external_location: "read_parquet('{{ env_var('ZOHELO_DATA_ROOT', '/tmp/zohelo_data') }}/02_bronze/mf_biala_lista/br_biala_lista_taxpayers.parquet')"

  - name: bronze_gleif
    schema: 02_bronze
    description: "GLEIF (Global Legal Entity Identifier) Bronze Parquet tables."
    config:
      enabled: "{{ var('enable_gleif', false) }}"
    tables:
      - name: lei2
        description: "Global entity reference records with national registration authority crosswalks (KRS, REGON)."
        meta:
          formatter: template
          external_location: "read_parquet('{{ env_var('ZOHELO_DATA_ROOT', '/tmp/zohelo_data') }}/02_bronze/gleif/br_gleif_lei2.parquet')"
      - name: relationship_records
        description: "Level 2 Golden Copy parent-child ownership relationships (who owns whom)."
        meta:
          formatter: template
          external_location: "read_parquet('{{ env_var('ZOHELO_DATA_ROOT', '/tmp/zohelo_data') }}/02_bronze/gleif/br_gleif_relationship_records.parquet')"
      - name: reporting_exceptions
        description: "Level 2 Golden Copy reasons for parent consolidation reporting exceptions."
        meta:
          formatter: template
          external_location: "read_parquet('{{ env_var('ZOHELO_DATA_ROOT', '/tmp/zohelo_data') }}/02_bronze/gleif/br_gleif_reporting_exceptions.parquet')"

  - name: bronze_imgw
    schema: 02_bronze
    description: "IMGW-PIB (Instytut Meteorologii i Gospodarki Wodnej) Bronze Parquet tables."
    config:
      enabled: "{{ var('enable_imgw_pib', false) }}"
    tables:
      - name: stations
        description: "Official IMGW-PIB meteorological stations catalog."
        meta:
          formatter: template
          external_location: "read_parquet('{{ env_var('ZOHELO_DATA_ROOT', '/tmp/zohelo_data') }}/02_bronze/imgw_pib/br_imgw_stations.parquet')"
      - name: synoptic_daily
        description: "Official IMGW-PIB synoptic daily meteorological observations."
        meta:
          formatter: template
          external_location: "read_parquet('{{ env_var('ZOHELO_DATA_ROOT', '/tmp/zohelo_data') }}/02_bronze/imgw_pib/br_imgw_synoptic_daily.parquet')"

  - name: bronze_gios
    schema: 02_bronze
    description: "GIOŚ PJP (Główny Inspektorat Ochrony Środowiska) Bronze Parquet tables."
    config:
      enabled: "{{ var('enable_gios_pjp', false) }}"
    tables:
      - name: stations
        description: "Official GIOŚ air quality monitoring station registry and coordinates."
        meta:
          formatter: template
          external_location: "read_parquet('{{ env_var('ZOHELO_DATA_ROOT', '/tmp/zohelo_data') }}/02_bronze/gios_pjp/br_gios_stations.parquet')"
      - name: sensors
        description: "Official GIOŚ air quality sensor registry and pollutant measurement parameters."
        meta:
          formatter: template
          external_location: "read_parquet('{{ env_var('ZOHELO_DATA_ROOT', '/tmp/zohelo_data') }}/02_bronze/gios_pjp/br_gios_sensors.parquet')"
      - name: measurements
        description: "Official GIOŚ hourly and daily air quality concentration measurements."
        meta:
          formatter: template
          external_location: "read_parquet('{{ env_var('ZOHELO_DATA_ROOT', '/tmp/zohelo_data') }}/02_bronze/gios_pjp/br_gios_measurements.parquet')"

