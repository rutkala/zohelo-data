version: 2

models:
  - name: stg_gios_stations
    description: "Staging view of GIOŚ air quality monitoring station metadata and WGS-84 coordinates."
    columns:
      - name: station_code
        description: "Official GIOŚ station identifier code."
      - name: station_name
        description: "Display name of the monitoring station."
  - name: stg_gios_sensors
    description: "Staging view of GIOŚ automated and manual air quality sensor identifiers and measured pollutants."
    columns:
      - name: sensor_code
        description: "Official GIOŚ sensor identifier code."
      - name: station_code
        description: "Parent station identifier."
  - name: stg_gios_measurements
    description: "Cleansed hourly and daily air quality concentration measurements across Poland."
    columns:
      - name: station_code
        description: "Monitoring station identifier."
      - name: pollutant
        description: "Measured air pollutant parameter (PM10, PM2.5, NO2, SO2, CO, O3, C6H6)."
      - name: measurement_timestamp
        description: "Observation timestamp in UTC."
      - name: value
        description: "Measured concentration value in ug/m3 or mg/m3."
  - name: dim_air_quality_station
    description: "Conformed dimension table of air quality monitoring stations with active sensor counts."
    columns:
      - name: station_code
        description: "Primary key: GIOŚ monitoring station code."
  - name: fact_daily_air_quality
    description: "Daily aggregated air quality observation facts (average, min, max, count) by station and pollutant."
    columns:
      - name: observation_date
        description: "Calendar observation date."
      - name: station_code
        description: "Station identifier."
      - name: pollutant
        description: "Air quality pollutant code."
