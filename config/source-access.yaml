schema_version: 1
verified_on: 2026-09-08

# This registry records account and secret prerequisites. It is not an ingestion
# allowlist and does not mean that every source below has an implemented adapter.
# Official provider ceilings are recorded only where the linked primary source
# states a number; runtime budgets should retain headroom below those ceilings.
secret_store:
  kind: github_actions_repository_secrets
  url: https://github.com/rutkala/zohelo-data/settings/secrets/actions

sources:
  - source_id: gus_bdl
    research_id: AR-001
    inventory_id: PLS-001
    provider: Statistics Poland (GUS)
    product: Bank Danych Lokalnych (BDL)
    account_class: free_account_increases_limit
    runtime_support: connected
    account_url: https://bdl.stat.gov.pl/api/v1/client?showInFrame=yes&theme=Default
    docs_url: https://api.stat.gov.pl/Home/BdlApi?lang=en
    free_benefit: Raises all four documented request ceilings and supplies a personal API client key.
    numeric_quota:
      anonymous:
        requests_per_second: 5
        requests_per_15_minutes: 100
        requests_per_12_hours: 1000
        requests_per_7_days: 10000
      registered:
        requests_per_second: 10
        requests_per_15_minutes: 500
        requests_per_12_hours: 5000
        requests_per_7_days: 50000
    credentials:
      - secret_name: GUS_BDL_API_KEY
        required_for: registered_limits
        transport: http_header
        header: X-ClientId
    registration_notes: A valid contact email is required because the generated key is sent there; no separate email-confirmation click is documented.

