sources:
  # ==========================================
  # SOURCE 1: NBP Table A (Convertible FX)
  # ==========================================
  nbp_exchange_rates_table_a:
    metadata:
      domain: "finance"
      category: "exchange_rates_convertible"
      geography: "poland"
      provider_type: "public_governed_official"
      source_name: "NBP"
      provider_url: "https://nbp.pl/"
      documentation_url: "https://api.nbp.pl/en.html"
      publication_schedule_url: "https://nbp.pl/statystyka-i-sprawozdawczosc/kursy/informacja-o-terminach-publikacji-kursow-walut/"
      frequency: "each working day"
      coverage_start: "2002-01-02"
      reuse_terms_url: "https://nbp.pl/regulaminy/"
      reuse_summary: "Public read access; commercial redistribution and attribution requirements unresolved."
      quote_unit: "NBP API quote in PLN; values retained without additional scaling"
      methodology_notes: "NBP Table A calculated middle rate. Preserve API values unchanged; website quotation quantities are presentation metadata."
      description: "Table A: NBP-calculated middle exchange rates of foreign currencies in Polish zlotys."

  # ==========================================
  # SOURCE 2: NBP Table B (Middle FX)
  # ==========================================
  nbp_exchange_rates_table_b:
    metadata:
      domain: "finance"
      category: "exchange_rates_table_b"
      geography: "poland"
      provider_type: "public_governed_official"
      source_name: "NBP"
      provider_url: "https://nbp.pl/"
      documentation_url: "https://api.nbp.pl/en.html"
      publication_schedule_url: "https://nbp.pl/statystyka-i-sprawozdawczosc/kursy/informacja-o-terminach-publikacji-kursow-walut/"
      frequency: "each Wednesday, or the preceding working day when Wednesday is a holiday"
      coverage_start: "2002-01-02"
      reuse_terms_url: "https://nbp.pl/regulaminy/"
      reuse_summary: "Public read access; commercial redistribution and attribution requirements unresolved."
      quote_unit: "NBP API quote in PLN; values retained without additional scaling"
      methodology_notes: "NBP Table B calculated middle rate. Preserve API values unchanged; website quotation quantities are presentation metadata."
      description: "Table B: NBP-calculated middle exchange rates of foreign currencies in Polish zlotys."

  # ==========================================
  # SOURCE 3: NBP Table C (Bid / Ask FX)
  # ==========================================
  nbp_exchange_rates_table_c:
    metadata:
      domain: "finance"
      category: "exchange_rates_bid_ask"
      geography: "poland"
      provider_type: "public_governed_official"
      source_name: "NBP"
      provider_url: "https://nbp.pl/"
      documentation_url: "https://api.nbp.pl/en.html"
      publication_schedule_url: "https://nbp.pl/statystyka-i-sprawozdawczosc/kursy/informacja-o-terminach-publikacji-kursow-walut/"
      frequency: "each working day"
      coverage_start: "2002-01-02"
      reuse_terms_url: "https://nbp.pl/regulaminy/"
      reuse_summary: "Public read access; commercial redistribution and attribution requirements unresolved."
      quote_unit: "NBP API quote in PLN; values retained without additional scaling"
      methodology_notes: "NBP Table C calculated buy (bid) and sell (ask) rates. Preserve effectiveDate as publication date and tradingDate as a separate Table C role."
      description: "Table C: NBP-calculated buy and sell exchange rates of foreign currencies for Polish zlotys."

  # ==========================================
  # SOURCE 4: NBP Gold Prices
  # ==========================================
  nbp_gold_prices:
    metadata:
      domain: "finance"
      category: "commodities"
      geography: "poland"
      provider_type: "public_governed_official"
      source_name: "NBP"
      provider_url: "https://nbp.pl/"
      documentation_url: "https://api.nbp.pl/en.html"
      publication_schedule_url: "https://nbp.pl/statystyka-i-sprawozdawczosc/kursy/cena-zlota/"
      frequency: "publication-day observations; the API does not promise a value for every calendar day"
      coverage_start: "2013-01-02"
      reuse_terms_url: "https://nbp.pl/regulaminy/"
      reuse_summary: "Public read access; commercial redistribution and attribution requirements unresolved."
      quote_unit: "PLN per gram of gold at 1000 millesimal fineness"
      methodology_notes: "NBP-calculated price of 1 g of gold at 1000 fineness; preserve the API cena value unchanged."
      description: "Current and historic NBP-calculated prices in PLN for 1 g of gold at 1000 millesimal fineness."

  # ==========================================
  # SOURCE 5: GUS BDL (Local Data Bank)
  # ==========================================
  gus_bdl:
    metadata:
      domain: "public_statistics"
      category: "local_and_regional_statistics"
      geography: "poland"
      provider_type: "public_governed_official"
      display_name: "GUS BDL (Local Data Bank)"
      source_name: "Statistics Poland (GUS)"
      provider_url: "https://stat.gov.pl/"
      documentation_url: "https://bdl.stat.gov.pl/api/v1"
      publication_schedule_url: "https://bdl.stat.gov.pl/bdl/start"
      frequency: "source-updated statistical catalogue and observations"
      coverage_start: "source_defined"
      reuse_terms_url: "https://api.stat.gov.pl/Home/TermsOfService?lang=en"
      reuse_summary: "Public BDL API access under Statistics Poland publication terms and CC BY 4.0 attribution requirements."
      quote_unit: "Source-owned measure units vary by variable; preserve source unit IDs and labels."
      methodology_notes: "Preserve BDL variable, unit, period and attrId semantics exactly; modeled metrics expose coverage/accountability totals rather than aggregating heterogeneous observation values."
      description: "Statistics Poland Local Data Bank metadata and observation responses retained from the BDL API."

  # ==========================================
  # SOURCE 6: World Bank WDI
  # ==========================================
  world_bank_wdi:
    metadata:
      domain: "public_statistics"
      category: "international_development_indicators"
      geography: "global"
      provider_type: "public_governed_official"
      display_name: "World Development Indicators (WDI)"
      source_name: "World Bank"
      provider_url: "https://www.worldbank.org/"
      documentation_url: "https://datahelpdesk.worldbank.org/knowledgebase/topics/125589-developer-information"
      publication_schedule_url: "https://datatopics.worldbank.org/world-development-indicators/"
      frequency: "source-updated annual indicator archive"
      coverage_start: "1960"
      reuse_terms_url: "https://datacatalog.worldbank.org/search/dataset/0037712/world-development-indicators"
      reuse_summary: "WDI catalogue record is public under CC BY 4.0; preserve World Bank attribution and indicator source notes."
      quote_unit: "Indicator-specific units and scaling are source metadata; values are preserved without generic aggregation."
      methodology_notes: "Countries and source-published aggregates remain distinct source entities. WDI values are heterogeneous and not exposed as a generic additive measure."
      description: "Complete World Development Indicators CSV archive with every supplied economy, aggregate, indicator, annual value and metadata member."

  # ==========================================
  # SOURCE 7: Eurostat
  # ==========================================
  eurostat:
    metadata:
      domain: "public_statistics"
      category: "european_statistics"
      geography: "europe"
      provider_type: "public_governed_official"
      display_name: "Eurostat"
      source_name: "Statistical Office of the European Union"
      provider_url: "https://ec.europa.eu/eurostat/"
      documentation_url: "https://ec.europa.eu/eurostat/web/user-guides/data-browser/api-data-access/api-introduction"
      publication_schedule_url: "https://ec.europa.eu/eurostat/web/main/data/database"
      frequency: "source-updated; catalogue and structures checked on the provider schedule"
      coverage_start: "source_defined"
      reuse_terms_url: "https://ec.europa.eu/eurostat/web/main/help/copyright-notice"
      reuse_summary: "Eurostat reuse is generally permitted with attribution; dataset, third-party, geography and detailed-trade exceptions remain controlling."
      quote_unit: "Dataset-specific units and classifications are preserved in the complete native dimensional key."
      methodology_notes: "Values are not generically additive. The progressive API model covers only the reviewed three-dataset, 81-country-series contract and never represents complete official catalogue coverage."
      description: "Eurostat retained JSON-stat API slices and full official distributions, with current progressive typed access while catalogue backfill continues."

  # ==========================================
  # SOURCE 8: OpenData.org (Entity Resolution)
  # ==========================================
  opendata_org:
    metadata:
      domain: "business_registries"
      category: "entity_resolution"
      geography: "global"
      provider_type: "public_open_data"
      display_name: "OpenData.org"
      source_name: "OpenData.org (BrightQuery Inc.)"
      provider_url: "https://opendata.org/"
      documentation_url: "https://opendata.org/"
      publication_schedule_url: "https://opendata.org/"
      frequency: "snapshot_distribution"
      coverage_start: "2026-03-05"
      reuse_terms_url: "https://opendata.org/terms"
      reuse_summary: "Open data download available; commercial redistribution requires agreement with BrightQuery Inc."
      quote_unit: "Entity records in Senzing format (organizations, locations, people)"
      methodology_notes: "Senzing JSON entity-resolved graphs linking global organizations, executives, digital identifiers, and geographic locations."
      description: "OpenData.org global business entity resolution dataset in native Senzing ZIP format."

  # ==========================================
  # SOURCE 9: GUS DBW (Dziedzinowe Bazy Wiedzy)
  # ==========================================
  gus_dbw:
    metadata:
      domain: "public_statistics"
      category: "domain_knowledge_databases"
      geography: "poland"
      provider_type: "public_governed_official"
      display_name: "GUS DBW (Subject-Matter Knowledge Databases)"
      source_name: "Statistics Poland (GUS)"
      provider_url: "https://stat.gov.pl/"
      documentation_url: "https://api-dbw.stat.gov.pl/apidocs/"
      publication_schedule_url: "https://dbw.stat.gov.pl/"
      frequency: "thematic domain statistics, periodic series, and bulk distributions"
      coverage_start: "source_defined"
      reuse_terms_url: "https://api.stat.gov.pl/Home/TermsOfService?lang=en"
      reuse_summary: "Public DBW access under Statistics Poland publication terms and CC BY 4.0 attribution requirements."
      quote_unit: "Domain-specific measure units vary by variable; preserved as delivered."
      methodology_notes: "Preserves exact DBW area hierarchy (Area -> Group -> Subgroup -> Indicator -> Section -> Dimension/Position) and dictionaries. Native-only transfer in landing according to ADR 0009."
      description: "Statistics Poland Subject-Matter Knowledge Databases (Dziedzinowe Bazy Wiedzy) multi-dimensional statistical metadata, bulk exports, and observations."

  # ==========================================
  # SOURCE 10: GUS TERYT (Territorial Register)
  # ==========================================
  gus_teryt:
    metadata:
      domain: "geography_and_registers"
      category: "administrative_territorial_register"
      geography: "poland"
      provider_type: "public_governed_official"
      display_name: "GUS TERYT (Krajowy Rejestr Urzędowy Podziału Terytorialnego Kraju)"
      source_name: "Statistics Poland (GUS)"
      provider_url: "https://eteryt.stat.gov.pl/"
      documentation_url: "https://eteryt.stat.gov.pl/eTeryt/rejestr_teryt/udostepnianie_danych/baza_internetowa/pliki_pelne.aspx"
      publication_schedule_url: "https://stat.gov.pl/obszary-tematyczne/inne-opracowania/rejestr-teryt/"
      frequency: "official public register, updated continuously upon territorial changes"
      coverage_start: "1999-01-01"
      reuse_terms_url: "https://stat.gov.pl/informacja-o-ponownym-wykorzystywaniu-informacji-sektora-publicznego/"
      reuse_summary: "Public register data available free of charge under Polish public sector information re-use provisions."
      quote_unit: "Official administrative codes: TERC (voivodeship, powiat, gmina), SIMC (locality), ULIC (street)"
      methodology_notes: "Official territorial division hierarchy of Poland. TERC represents territorial division; SIMC represents localities; ULIC represents streets."
      description: "Complete national register of territorial division, localities, and streets maintained by Statistics Poland."

  # ==========================================
  # SOURCE 11: GUGiK PRG (State Register of Boundaries)
  # ==========================================
  gugik_prg:
    metadata:
      domain: "geography_and_registers"
      category: "geodetic_administrative_boundaries"
      geography: "poland"
      provider_type: "public_governed_official"
      display_name: "GUGiK PRG (Państwowy Rejestr Granic)"
      source_name: "Head Office of Geodesy and Cartography (GUGiK)"
      provider_url: "https://www.geoportal.gov.pl/"
      documentation_url: "https://www.geoportal.gov.pl/pl/dane/panstwowy-rejestr-granic-prg/"
      publication_schedule_url: "https://opendata.geoportal.gov.pl/prg/"
      frequency: "official geodetic boundary packages and annual surface area registers"
      coverage_start: "source_defined"
      reuse_terms_url: "https://www.geoportal.gov.pl/pl/o-geoportalu/zasady-korzystania/"
      reuse_summary: "Open data under Polish Geodetic and Cartographic Law; freely available for re-use without license restrictions."
      quote_unit: "Official GIS polygons (EPSG:2180 / WGS84 WKT) and geodetic surface area in hectares and square kilometers."
      methodology_notes: "Official State Register of Boundaries maintained by the Surveyor General of Poland. Defines spatial geometries of all Polish administrative units."
      description: "Official geospatial boundary polygons and geodetic area registers for country, voivodeships, powiats, and gminas."

  # ==========================================
  # SOURCE 12: MF Biała Lista (VAT Taxpayers Register)
  # ==========================================
  mf_biala_lista:
    metadata:
      domain: "tax_and_finance"
      category: "vat_taxpayer_register"
      geography: "poland"
      provider_type: "public_governed_official"
      display_name: "MF Biała Lista Podatników VAT"
      source_name: "Ministry of Finance / National Revenue Administration (KAS)"
      provider_url: "https://www.podatki.gov.pl/"
      documentation_url: "https://www.podatki.gov.pl/vat/bezpieczna-transakcja/wykaz-podatnikow-vat/plik-plaski/"
      publication_schedule_url: "https://plikplaski.mf.gov.pl/pliki/"
      frequency: "daily official flat file snapshot published at 00:00"
      coverage_start: "2019-09-01"
      reuse_terms_url: "https://www.podatki.gov.pl/"
      reuse_summary: "Free of charge under Creative Commons Attribution 3.0 Poland (CC BY 3.0 PL)."
      quote_unit: "VAT registration status, settlement account masks, and cryptographic validation hashes."
      methodology_notes: "Official register of entities registered as VAT taxpayers (active, exempt, deleted, restored) and verified business bank accounts."
      description: "Ministerstwo Finansów daily flat file containing comprehensive register of VAT taxpayers and bank account verification hashes."

  # ==========================================
  # SOURCE 13: GLEIF Global LEI Index
  # ==========================================
  gleif:
    metadata:
      domain: "business_registries"
      category: "global_legal_entity_identifier"
      geography: "global"
      provider_type: "international_public_official"
      display_name: "Global Legal Entity Identifier Foundation (GLEIF)"
      source_name: "Global Legal Entity Identifier Foundation (GLEIF)"
      provider_url: "https://www.gleif.org/"
      documentation_url: "https://www.gleif.org/en/lei-data/access-and-use-lei-data"
      publication_schedule_url: "https://goldencopy.gleif.org/api/v2/golden-copies/publishes"
      frequency: "golden copy updated 3 times daily; official daily bulk distributions"
      coverage_start: "2012-01-01"
      reuse_terms_url: "https://www.gleif.org/en/lei-data/access-and-use-lei-data/lei-data-terms-of-use"
      reuse_summary: "Open data under GLEIF LEI Data Terms of Use; free public access without registration."
      quote_unit: "20-character ISO 17442 LEI code, legal names, addresses, registration authorities, and parent ownership linkages."
      methodology_notes: "Level 1: Legal entity reference data (who is who). Level 2: Relationship records and exceptions (who owns whom)."
      description: "Global Legal Entity Identifier Golden Copy and Concatenated Files linking entities, jurisdictions, and corporate control structures globally."

