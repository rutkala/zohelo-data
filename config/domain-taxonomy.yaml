classification_rules:
- Store scheme, edition/version, code, source-native label, English label, validity interval and hierarchy path with
  every classified value.
- A correspondence table is evidence for a versioned mapping, not proof of one-to-one equivalence; retain mapping
  direction, cardinality and provenance.
- PKD/NACE classify activities; PKWiU/CPA/CPC classify products or services; HS/CN classify traded goods; COICOP classifies
  consumption purpose; COFOG classifies government function; ISCED classifies education; ICD classifies disease and
  causes of death.
- Do not derive a product category from an entity activity code, or an activity from a product code, without an explicit
  versioned rule.
