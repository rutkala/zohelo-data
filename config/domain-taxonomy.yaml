schema_version: 1.0.0
taxonomy_version: 2026-09-08.1
language: en
status: candidate
scope: Product-level discovery taxonomy for worldwide context and detailed Poland coverage.
interpretation:
- A taxonomy assignment is a discovery hypothesis, not proof that a source contains every dataset in the category.
- Subject domains, analytical dimensions and official classifications are independent axes; never substitute one for
  another.
- Dataset contracts may select narrower categories and must retain source-native codes, labels, versions and definitions.
identifier_policy:
  format: lowercase ASCII segments separated by hyphens; hierarchy separated by dots
  stability: Published identifiers are append-only. Rename labels without changing identifiers; deprecate instead
    of reusing identifiers.
  versioning: Patch for wording/evidence, minor for additive categories, major for identifier removal or changed meaning.
