services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-10-15T17-29-55Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
      MINIO_DOMAIN: minio
    ports:
      - "9000:9000"
    networks:
      iceberg_net:
        aliases:
          - warehouse.minio

  mc:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - minio
    networks:
      - iceberg_net
    entrypoint:
      - /bin/sh
      - -c
      - |
        until /usr/bin/mc alias set minio http://minio:9000 admin password; do
          sleep 1
        done
        /usr/bin/mc mb --ignore-existing minio/warehouse

  rest:
    image: apache/iceberg-rest-fixture@sha256:db8de90b5b7693d4ac334c336f91d9bbe320d7b19f4f514d26de84cdfbcbfe8d
    depends_on:
      mc:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    ports:
      - "8181:8181"
    networks:
      - iceberg_net

networks:
  iceberg_net:
