zohelo_data:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('ZOHELO_DUCKDB_PATH', '/tmp/zohelo_docs.duckdb') }}"
      # Serialize dbt model DDL; concurrent adapter renames failed fresh WAL
      # replay in the regression environment. DuckDB query execution is separate.
      threads: 1
